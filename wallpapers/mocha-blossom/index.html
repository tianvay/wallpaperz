<script type="module">
// A terraced hill town in cherry blossom, ringed by a lake, with lavender fields on the far shore.
// Catppuccin Latte by day, Mocha by night: paper lanterns climb the hill, floating lanterns drift on the lake,
// sky lanterns rise at night, petals blow past the camera, six different boats criss-cross the lake.
// URL options: see kit3d.js.
// It also tells the real time: the lanterns along the pilgrim path light up one by one from the lake to the temple
// over the hour, and on the hour the temple bell strikes the hour (1-12) while every house lets a sky lantern go.
// Seen from straight above the land is a clock face, with four monasteries on the peaks at 12, 3, 6 and 9 o'clock that
// hold a ritual when the minute hand reaches them (timetable: see "the dial" below).
import { createWorld, THREE, mergeGeometries, P, L, mix, smooth, fbm, ridged } from './kit3d.js';

function rawHeight(x, z) {
  const r = Math.hypot(x, z);
  let h = 245 * Math.exp(-Math.pow(r / 280, 2.2)) * (0.9 + 0.15 * fbm(x * 0.005, z * 0.005, 3));
  h += 30 * (fbm(x * 0.004 + 10, z * 0.004, 4) * 0.5 + 0.5);
  const lake = fbm(x * 0.003, z * 0.003 + 5, 3) * 0.5 + 0.5;
  h -= 80 * Math.exp(-Math.pow((r - 560) / 150, 2)) * (0.55 + 0.7 * lake);
  h += 110 * smooth(700, 1100, r) * (0.4 + 0.6 * (fbm(x * 0.0035 + 40, z * 0.0035, 4) * 0.5 + 0.5));
  h += 430 * smooth(1300, 1800, r) * (0.35 + 0.8 * ridged(x * 0.004 + 3, z * 0.004, 4));
  h += 4 * fbm(x * 0.03, z * 0.03, 2);
  const tw = smooth(470, 360, r) * smooth(8, 24, h);                 // terraces on the town hill
  if (tw > 0) { const st = 19, u = h / st, f = u - Math.floor(u); h += (st * (Math.floor(u) + smooth(0.8, 1, f)) - h) * tw; }
  for (const p of PEAKS) {                          // the monastery peaks on the dial: steep, craggy flanks
    const d = Math.hypot(x - p.x, z - p.z);
    if (d < 240) h += p.H * Math.pow(smooth(240, 46, d), 1.3) + 22 * ridged(x * 0.018 + p.hh, z * 0.018, 3) * smooth(46, 110, d) * smooth(240, 150, d);
  }
  return h - 6;
}

// ---------- the dial: seen from straight above, the land reads as a clock face ----------
// 12 o'clock is -z and the hours run clockwise seen from above. The town hill is the hub, the lake the inner ring; on
// the circle DIAL_R stand four monastery peaks (12, 3, 6, 9) and eight hour shrines, linked by a pilgrims' circuit.
const DIAL_R = 1100;
const clockAt = (hh, r = DIAL_R) => { const a = -Math.PI / 2 + hh / 12 * Math.PI * 2; return [Math.cos(a) * r, Math.sin(a) * r]; };
const PEAKS = [[12, 215], [3, 250], [6, 190], [9, 175]].map(([hh, H]) => { const [x, z] = clockAt(hh); return { hh, x, z, H, top: 0 }; });
for (const p of PEAKS) p.top = rawHeight(p.x, p.z);
const MARKS = [1, 2, 4, 5, 7, 8, 10, 11].map((hh) => { const [x, z] = clockAt(hh); return { hh, x, z }; });
function height0(x, z) {                            // each summit is levelled into a plateau for its monastery
  let h = rawHeight(x, z);
  for (const p of PEAKS) { const d = Math.hypot(x - p.x, z - p.z); if (d < 64) h += (p.top - h) * smooth(64, 42, d); }
  return h;
}

// ---------- pilgrim path: winds up the south (+z) face from the lake to the temple gate ----------
// The centreline is pure geometry; its elevation profile is the terrain smoothed along the path, and the terrain is
// carved to that profile near the path, so it climbs the terraces as gentle ramps instead of cliffs.
const GATE = { x: 16, z: 66 };                    // temple gate at the end of the winding part
const PX = [], PZ = [], PH = [], PS = [], PLAT = [];
let PATH_WIND = 0;                                // index where the straight temple approach begins
{
  const R0 = 420, R1 = GATE.z, N = 6000;
  const lat = (k) => (62 * Math.sin(2 * Math.PI * 3.25 * k) + 9 * Math.sin(k * 29 + 1)) * smooth(0, 0.05, k) * smooth(1, 0.82, k) - GATE.x * smooth(0.8, 1, k);
  const push = (x, z, l) => {
    const n = PX.length;
    if (n && Math.hypot(x - PX[n - 1], z - PZ[n - 1]) < 1) return;
    PS.push(n ? PS[n - 1] + Math.hypot(x - PX[n - 1], z - PZ[n - 1]) : 0); PX.push(x); PZ.push(z); PLAT.push(l);
  };
  for (let i = 0; i <= N; i++) { const k = i / N, l = lat(k); push(-l, R0 + (R1 - R0) * k, l); }
  PATH_WIND = PX.length;
  for (let z = GATE.z - 1; z >= 4; z--) push(GATE.x, z, 0);
  let h = PX.map((x, i) => height0(x, PZ[i]));
  for (let pass = 0; pass < 3; pass++) {           // box blur ±20 samples, three passes ≈ gaussian
    const o = h.slice();
    for (let i = 0; i < h.length; i++) { let s = 0, n = 0; for (let j = Math.max(0, i - 20); j <= Math.min(h.length - 1, i + 20); j++) { s += o[j]; n++; } h[i] = s / n; }
  }
  for (let i = 0; i < h.length; i++) PH.push(Math.max(0.6, h[i]));
}
const PCELL = 16, PGRID = new Map();
PX.forEach((x, i) => { const k = Math.floor(x / PCELL) * 4096 + Math.floor(PZ[i] / PCELL); if (!PGRID.has(k)) PGRID.set(k, []); PGRID.get(k).push(i); });
let PN_D = 1e9, PN_I = -1;                        // results of the last pathNear() call
function pathNear(x, z) {
  const ix = Math.floor(x / PCELL), iz = Math.floor(z / PCELL);
  let best = 1e18; PN_I = -1;
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
    const list = PGRID.get((ix + a) * 4096 + iz + b); if (!list) continue;
    for (const i of list) { const dx = PX[i] - x, dz = PZ[i] - z, d = dx * dx + dz * dz; if (d < best) { best = d; PN_I = i; } }
  }
  PN_D = PN_I < 0 ? 1e9 : Math.sqrt(best);
  return PN_D;
}
function height(x, z) {
  const h = height0(x, z);
  if (pathNear(x, z) > 15) return h;
  return h + (PH[PN_I] - h) * smooth(15, 5.5, PN_D);
}

// ---------- time of day: Latte by day, Mocha by night ----------
const NIGHT = { top: mix(P.crust, P.base, 0.6), mid: mix(P.base, P.s0, 0.5), hor: mix(P.s0, P.s1, 0.35), glow: P.s1, disc: P.lav,
  light: P.lav, lightI: 0, hemi: mix(P.lav, P.blue, 0.3), hemiI: 0.4, cloud: mix(P.s1, P.s2, 0.4), mist: mix(P.s1, P.o0, 0.3),
  water: mix(P.s0, P.blue, 0.1), fogD: 0.0006, stars: 1, win: 1, snow: 0.12 };
const KEYS = [
  { e: -1, ...NIGHT }, { e: -0.3, ...NIGHT },
  { e: -0.08, top: mix(P.base, P.s1, 0.5), mid: mix(P.s1, P.mauve, 0.3), hor: mix(P.mauve, P.pink, 0.35).lerp(P.s1, 0.4), glow: mix(P.pink, P.peach, 0.4),
    disc: P.peach, light: P.pink, lightI: 0, hemi: mix(P.lav, P.mauve, 0.4), hemiI: 0.85, cloud: mix(P.mauve, P.s2, 0.45), mist: mix(P.o0, P.mauve, 0.25),
    water: mix(P.s1, P.mauve, 0.2), fogD: 0.00065, stars: 0.45, win: 0.95, snow: 0.25 },
  { e: 0.06, top: mix(L.lav, L.base, 0.5), mid: mix(L.pink, L.base, 0.6), hor: mix(L.rose, L.base, 0.55), glow: mix(L.peach, L.base, 0.4),
    disc: mix(L.yellow, L.base, 0.3), light: mix(L.peach, L.base, 0.55), lightI: 2.1, hemi: mix(L.pink, L.base, 0.5), hemiI: 1.35,
    cloud: mix(L.pink, L.base, 0.6), mist: L.base, water: mix(L.lav, L.base, 0.5), fogD: 0.00045, stars: 0.08, win: 0.5, snow: 0.2 },
  { e: 0.3, top: mix(L.blue, L.base, 0.55), mid: mix(L.sky, L.base, 0.72), hor: L.base, glow: L.base, disc: L.base,
    light: mix(L.base, L.yellow, 0.08), lightI: 2.3, hemi: L.base, hemiI: 1.45, cloud: L.base, mist: L.base, water: mix(L.sky, L.base, 0.55),
    fogD: 0.00034, stars: 0, win: 0.05, snow: 0.08 },
  { e: 1, top: mix(L.blue, L.base, 0.45), mid: mix(L.sky, L.base, 0.65), hor: L.base, glow: L.base, disc: L.base,
    light: L.base, lightI: 2.4, hemi: L.base, hemiI: 1.5, cloud: L.base, mist: L.base, water: mix(L.sky, L.base, 0.5),
    fogD: 0.0003, stars: 0, win: 0, snow: 0.06 },
];

const grass = mix(L.green, L.base, 0.42), riser = mix(L.rose, L.s1, 0.45).lerp(L.base, 0.2), sand = mix(L.rose, L.base, 0.6), rock = mix(L.s1, L.o0, 0.3);
const pathDirt = mix(L.rose, L.s1, 0.5).lerp(L.base, 0.25), paving = mix(L.s1, L.base, 0.45), dialStone = mix(L.text, L.rose, 0.25).lerp(L.o1, 0.35);
const lavA = mix(L.lav, L.mauve, 0.45).lerp(L.base, 0.3), meadow = mix(L.green, L.yellow, 0.25).lerp(L.base, 0.5);
const isLavender = (x, z) => {
  const r = Math.hypot(x, z);
  return r > 760 && r < 1250 && Math.sin((x * 0.6 + z * 0.8) * 0.33 + fbm(x * 0.004, z * 0.004, 2) * 6) > 0.1 && fbm(x * 0.003 + 7, z * 0.003, 3) > -0.1;
};

const W = createWorld({
  seed: 424242, height, keys: KEYS, tod: 0.7,
  terrain: { size: 3800, seg: 480, color(x, y, z, up, c) {
    const r = Math.hypot(x, z);
    if (y < -1) c.copy(mix(L.s0, L.sky, 0.15));
    else if (y < 3) c.copy(sand);
    else {
      c.copy(grass).lerp(meadow, 0.5 * (fbm(x * 0.01, z * 0.01, 2) * 0.5 + 0.5));
      if (up > 0.85 && isLavender(x, z)) c.copy(lavA);
    }
    if (r < 480) c.lerp(riser, smooth(0.86, 0.6, up));
    if (r < 650 && y > 3) c.lerp(mix(L.pink, L.base, 0.6), 0.35 * smooth(-0.1, 0.5, fbm(x * 0.02 + 3, z * 0.02, 3)) * smooth(650, 400, r));
    c.lerp(rock, smooth(0.75, 0.5, up) * smooth(20, 80, y));
    if (r < 480 && pathNear(x, z) < 11) c.lerp(pathDirt, 0.6 * smooth(11, 4, PN_D));          // trodden earth along the path
    const dr = Math.abs(r - DIAL_R);                                                             // the dial: circuit, ticks, plazas, summits
    if (dr < 11) c.lerp(dialStone, 0.85 * smooth(11, 6, dr));
    if (dr < 115) {
      const hf = ((Math.atan2(z, x) + Math.PI / 2) / (Math.PI * 2) * 12 + 12) % 12, hr = Math.round(hf) % 12, arc = Math.abs(hf - Math.round(hf)) * Math.PI * 2 * r / 12;
      if (hr % 3 && arc < 10) c.lerp(dialStone, 0.85 * smooth(10, 6, arc) * smooth(110, 95, dr));         // hour ticks across the circuit
      for (const m of MARKS) { const d = Math.hypot(x - m.x, z - m.z); if (d < 28) c.lerp(paving, smooth(28, 22, d)); }
      for (const p of PEAKS) { const d = Math.hypot(x - p.x, z - p.z); if (d < 48) c.lerp(paving, 0.9 * smooth(48, 42, d)); }
    }
    const sn = smooth(380, 460, y + 30 * fbm(x * 0.01, z * 0.01, 2));
    c.lerp(L.base, sn);
    return sn * 0.6;
  } },
  water: { radius: 2200 },
  path: (t) => { const a = t * 0.0055, r = 565 + 45 * Math.sin(t * 0.008 + 1); return [Math.cos(a) * r, Math.sin(a) * r]; },
  center: new THREE.Vector3(0, 180, 0), hover: [70, 50], centerPull: 0.32,
  houseTones: {
    walls: [mix(L.base, L.rose, 0.12), L.mantle, mix(L.base, L.yellow, 0.1), mix(L.base, L.pink, 0.08), L.base],
    roofs: [mix(L.o2, L.text, 0.3), mix(L.maroon, L.o2, 0.5), mix(L.blue, L.o2, 0.6), mix(L.teal, L.o2, 0.6), mix(L.rose, L.o2, 0.45)],
  },
  bloom: { threshold: 0.95, day: 0.25, night: 0.6 },
  groundLight: mix(P.mantle, P.s0, 0.5), moonI: 0.6,
});
const { rnd, scene, SOLID, GLOW, DIM, place, tinted, plain, gable, toWorld, groundMin, groundRange, house, addLight, glowMat, keepClear, SIGHTS, animators, wakeSources, slopeAt, groundAt } = W;
const HOUSES = [];                                // roof tops: sky lanterns are launched from here at night

const CLOCK = W.clock;                            // the real time: { c: wallClock(), struck: true on the frame the hour changes }
const SPECIMENS = [];                             // hand-placed feature trees: { x, z, sc, kind: 'sakura' | 'maple' }

// ---------- East Asian building kit: curved tiled roofs with upturned eaves, plaster and timber, stone plinths ----------
const ROOF = [];                                  // roofs are open shells: drawn double-sided
const C_ = {
  wall: [L.base, mix(L.base, L.rose, 0.08), mix(L.base, L.yellow, 0.06), L.mantle],
  timber: mix(L.text, L.rose, 0.2).lerp(L.o2, 0.2), stone: mix(L.s1, L.o0, 0.35),
  tile: [mix(L.text, L.o2, 0.35), mix(L.text, L.blue, 0.25).lerp(L.o2, 0.3), mix(L.teal, L.o2, 0.5), mix(L.text, L.o2, 0.5)],
  red: mix(L.red, L.maroon, 0.35).lerp(L.o2, 0.15), gold: mix(L.yellow, L.base, 0.2),
};
// hip roof over a w×d footprint (ridge along the longer side), concave slopes, eaves lifting at the corners
function curvedRoof(w, d, h, over = 2, lift = 1.5, seg = 14) {
  const long = w >= d, W = (long ? w : d) + over * 2, D = (long ? d : w) + over * 2, ridge = Math.max(0, (W - D) / 2);
  const g = new THREE.PlaneGeometry(W, D, seg, seg).rotateX(-Math.PI / 2), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const rx = Math.min(1, Math.max(0, Math.abs(x) - ridge) / (D / 2)), rz = Math.min(1, Math.abs(z) / (D / 2)), m = Math.max(rx, rz);
    p.setY(i, h * Math.pow(1 - m, 1.45) + lift * Math.pow(rx * rz, 2.2) + lift * 0.25 * Math.pow(m, 6));
  }
  if (!long) g.rotateY(Math.PI / 2);
  g.computeVertexNormals();
  return { g, ridgeLen: ridge * 2, long };
}
function roofAt(w, d, h, over, lift, color, x, y, z, ry) {
  const { g, ridgeLen, long } = curvedRoof(w, d, h, over, lift);
  ROOF.push(place(tinted(g, color), x, y, z, ry));
  if (ridgeLen > 0.5) SOLID.push(place(tinted(new THREE.BoxGeometry(long ? ridgeLen + 0.6 : 0.7, 0.7, long ? 0.7 : ridgeLen + 0.6).translate(0, y - y + h + 0.25, 0), C_.tile[0]), x, y, z, ry));
}
// a townhouse: stone plinth, white plaster walls with dark timber posts and beams, glowing paper screens,
// one or two storeys with a skirt roof between them
function minka(x, z, ry, w, d, opts = {}) {
  const [lo, hi] = groundRange(x, z, ry, w + 1.5, d + 1.5), base = lo - 0.6, plinth = hi - lo + 1.4;
  const wall = opts.wall || C_.wall[(rnd() * C_.wall.length) | 0], tile = opts.tile || C_.tile[(rnd() * C_.tile.length) | 0];
  const two = opts.two ?? rnd() < 0.3, H1 = 5.2;
  SOLID.push(place(tinted(new THREE.BoxGeometry(w + 1.2, plinth, d + 1.2).translate(0, plinth / 2, 0), C_.stone), x, base, z, ry));
  let y = plinth;
  const storey = (sw, sd, sh, y0) => {
    SOLID.push(place(tinted(new THREE.BoxGeometry(sw, sh, sd).translate(0, y0 + sh / 2, 0), wall), x, base, z, ry));
    for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) SOLID.push(place(tinted(new THREE.BoxGeometry(0.45, sh, 0.45).translate(sx * sw / 2, y0 + sh / 2, sz * sd / 2), opts.posts || C_.timber), x, base, z, ry));
    for (const by of [y0 + sh * 0.62, y0 + sh - 0.2]) SOLID.push(place(tinted(new THREE.BoxGeometry(sw + 0.12, 0.35, sd + 0.12).translate(0, by, 0), C_.timber), x, base, z, ry));
    const nw = Math.max(1, Math.round(sw / 4.5));
    for (const sz of [1, -1]) for (let k = 0; k < nw; k++) {
      if (rnd() < 0.18) continue;
      const cx = (k - (nw - 1) / 2) * (sw / nw), pg = new THREE.PlaneGeometry(sw / nw * 0.62, sh * 0.42).rotateY(sz > 0 ? 0 : Math.PI).translate(cx, y0 + sh * 0.33, sz * (sd / 2 + 0.04));
      (rnd() < 0.3 ? DIM : GLOW).push(place(plain(pg), x, base, z, ry));
    }
  };
  if (two) {
    storey(w, d, H1, y);
    roofAt(w, d, 1.1, 1.5, 0.5, tile, x, base + y + H1 - 0.1, z, ry);         // skirt roof
    storey(w * 0.72, d * 0.72, 4, y + H1 + 0.5);
    roofAt(w * 0.72, d * 0.72, 3.2, 1.9, 1.4, tile, x, base + y + H1 + 4.4, z, ry);
  } else {
    storey(w, d, H1, y);
    roofAt(w, d, 3.6, 2, 1.4, tile, x, base + y + H1 - 0.1, z, ry);
  }
  HOUSES.push({ x, z, y: base + y + (two ? H1 + 7.6 : H1 + 3.6) });
  if (rnd() < 0.25 && W.smokeSources.length < 8) W.smokeSources.push(toWorld(w * 0.25, plinth + H1 + 4, 0, x, base, z, ry));
}

// paper-lantern materials: pale paper by day, glowing at night
const lanternPink = glowMat(P.pink, 0.55, 3.2), lanternPeach = glowMat(P.peach, 0.5, 3.0);
const lanternSoft = glowMat(P.pink, 0.5, 1.5), lanternRed = glowMat(mix(P.red, P.peach, 0.45), 0.5, 2.2);
const lanternGeo = new THREE.CylinderGeometry(0.9, 0.9, 1.7, 8);
const placed = [];
const FEST = [[], []];                            // small festival lanterns (pink, peach), merged at the end
const ink = mix(L.text, L.o2, 0.25), bronze = mix(L.teal, L.o2, 0.45).lerp(L.yellow, 0.1), stoneL = mix(L.s1, L.base, 0.3);

// stone lantern (tōrō): footing, shaft, platform, glowing light box, six-sided cap, jewel on top
function stoneLantern(x, z, s = 1, y = null) {
  const g = (y ?? groundAt(x, z)) - 0.2;
  const add = (geo, yy) => SOLID.push(tinted(geo.translate(x, g + yy * s, z), stoneL));
  add(new THREE.CylinderGeometry(0.75 * s, 0.85 * s, 0.45 * s, 6), 0.22);
  add(new THREE.CylinderGeometry(0.24 * s, 0.3 * s, 1.4 * s, 8), 1.1);
  add(new THREE.CylinderGeometry(0.7 * s, 0.55 * s, 0.3 * s, 6), 1.95);
  GLOW.push(plain(new THREE.BoxGeometry(0.72 * s, 0.7 * s, 0.72 * s).translate(x, g + 2.45 * s, z)));
  for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) add(new THREE.BoxGeometry(0.16 * s, 0.7 * s, 0.16 * s).translate(a * 0.42 * s, 0, b * 0.42 * s), 2.45);
  add(new THREE.ConeGeometry(1.05 * s, 0.65 * s, 6), 3.1);
  add(new THREE.IcosahedronGeometry(0.2 * s, 0), 3.55);
}
// torii: two pillars on black footings, tie beam, strut, double lintel with upturned black top; spans local x
function torii(x, z, ry, w, hgt, col = C_.red, baseY = null) {
  const g0 = baseY ?? groundAt(x, z), top = g0 + hgt, k = w / 10, r = 0.25 + w * 0.04;
  for (const s of [-1, 1]) {
    const p = toWorld(s * w / 2, 0, 0, x, 0, z, ry), gb = (baseY === null ? groundAt(p.x, p.z) : Math.min(baseY, groundAt(p.x, p.z))) - 0.8;
    SOLID.push(tinted(new THREE.CylinderGeometry(r, r * 1.12, top - gb, 8).translate(p.x, (top + gb) / 2, p.z), col));
    SOLID.push(tinted(new THREE.CylinderGeometry(r * 1.3, r * 1.45, 1.4 * k + 0.8, 8).translate(p.x, (baseY ?? gb + 0.8) + 0.7 * k - 0.4, p.z), ink));
  }
  const beam = (geo, c) => SOLID.push(place(tinted(geo, c), x, 0, z, ry));
  beam(new THREE.BoxGeometry(w * 1.3, 0.75 * k, 1.15 * k).translate(0, top + 0.55 * k, 0), ink);              // kasagi
  for (const s of [-1, 1]) beam(new THREE.BoxGeometry(w * 0.2, 0.7 * k, 1.15 * k).rotateZ(s * 0.22).translate(s * w * 0.72, top + 0.72 * k, 0), ink);
  beam(new THREE.BoxGeometry(w * 1.28, 0.6 * k, 0.95 * k).translate(0, top - 0.1 * k, 0), col);               // shimaki
  beam(new THREE.BoxGeometry(w * 1.15, 0.5 * k, 0.6 * k).translate(0, top - hgt * 0.24, 0), col);             // nuki
  beam(new THREE.BoxGeometry(0.55 * k, hgt * 0.24 - 0.5 * k, 0.5 * k).translate(0, top - hgt * 0.12 - 0.25 * k, 0), col);
}
// a sagging rope between a and b with n small paper lanterns hanging from it
function lanternString(a, b, n, sag) {

// sky lanterns: at night every house lets one go every 2-3 minutes. Each lifts off its roof slowly, picks up the

{
  const MAX = 400, mesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 0.72, 1.8, 8), glowMat(mix(P.peach, P.yellow, 0.35), 0.45, 2.4), MAX);
  mesh.frustumCulled = false; mesh.count = 0; mesh.setColorAt(0, new THREE.Color(1, 1, 1)); scene.add(mesh);
  const live = [], rand = Math.random;
  const spawn = (h, age) => ({ x: h.x, y: h.y, z: h.z, age, life: 130 + rand() * 50, vy: 2.3 + rand() * 1.1, ws: 1.1 + rand() * 1.1, wa: 0.9 + 0.35 * Math.sin(performance.now() * 1e-5) + (rand() - 0.5) * 0.4, ph: rand() * 6.28 });
  for (const h of HOUSES) h.next = 5 + rand() * 175;
  let first = true, burst = 0;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = new THREE.Vector3(), scl = new THREE.Vector3(), col = new THREE.Color(), Y = new THREE.Vector3(0, 1, 0);
  animators.push((t, night, dt) => {
    if (CLOCK.struck) { burst = 25; for (const h of HOUSES) h.next = Math.min(h.next, 2 + rand() * 14); }   // on the hour: one from every house
    burst -= dt;
    const launching = night > 0.55 || burst > 0;
    if (first) {                                  // page opened at night: the sky already holds the last couple of minutes' lanterns
      first = false;
      if (launching) for (const h of HOUSES) if (rand() < 0.9 && live.length < MAX) live.push(spawn(h, rand() * 150));
    }
    if (launching) for (const h of HOUSES) { h.next -= dt; if (h.next <= 0) { h.next = 120 + rand() * 60; if (live.length < MAX) live.push(spawn(h, 0)); } }
    let n = 0;
    for (let i = 0; i < live.length; i++) {
      const L_ = live[i]; L_.age += dt;
      if (L_.age > L_.life) { live[i--] = live[live.length - 1]; live.pop(); continue; }
      const a = L_.age, rise = L_.vy * (a - 4 * (1 - Math.exp(-a / 4))), drift = L_.ws * (a - 15 * (1 - Math.exp(-a / 15))), sway = 3 * Math.sin(a * 0.3 + L_.ph) * Math.min(1, a / 20);

  });
}

// ---------- the lake fleet: twelve piers, six different boats criss-crossing the lake ----------
// Piers stand on both shores at the 10-minute positions of the dial (12, 2, 4, 6, 8 and 10 o'clock). Each boat keeps to
