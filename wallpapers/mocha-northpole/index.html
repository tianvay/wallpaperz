<script type="module">
// Santa's workshop at the North Pole. A red workshop hall with a clock tower (it shows the real time) and a present
// conveyor into a giant sack; a Christmas tree with a tent of light garlands, a toy train and a little market on the
// square; the striped pole on its roundabout; roads and footpaths linking a village of pastel elf houses, along which
// elves walk to work and back; a post office swallowing letters from the sky, a skating pond, a sledding hill, a
// gingerbread house, igloos, snowmen, the reindeer paddock (one calf is practising to fly), polar bears on the sea
// ice, and the sleigh looping overhead with magic sparkling from the reindeers' hooves.
// Every object carries two colours: Catppuccin Latte by day, Catppuccin Mocha by night. URL options: see kit3d.js.
// It tells the real time: besides the tower clock (now with a seconds hand), the toy train runs one lap a minute and
// passes the workshop side of the square on the full minute, and on the hour fireworks burst over the square, one per
// hour (1-12), while the star on the clock tower spins and flares.
import { createWorld, THREE, mergeGeometries, P, L, mix, smooth, fbm, ridged } from './kit3d.js';

const sq = (v) => v * v;
const HILL = { x: -270, z: 172 };                     // the sledding hill
function height(x, z) {
  const r = Math.hypot(x, z), a = Math.atan2(z, x);
  const coast = 760 + 120 * fbm(Math.cos(a) * 1.3 + 5, Math.sin(a) * 1.3, 3);
  let h = 12 + 8 * fbm(x * 0.006, z * 0.006, 3);
  h += 45 * smooth(230, 480, r) * (0.5 + 0.5 * fbm(x * 0.004 + 7, z * 0.004 - 3, 4));
  const f = smooth(240, 150, r); h = h * (1 - f) + 12 * f;                               // flat village ground
  h += 2.5 * fbm(x * 0.05, z * 0.05, 2) * (1 - f);
  h += 42 * Math.exp(-(sq(x - HILL.x) + sq(z - HILL.z)) / sq(80));
  h -= (h + 28) * smooth(coast - 160, coast + 40, r);                                     // shore down to the frozen sea
  h += 380 * smooth(1750, 2250, r) * (0.3 + 0.9 * ridged(x * 0.003 + 2, z * 0.003, 4));  // far icy ranges
  return h;
}

// ---------- sky and light through the day ----------

// ---------- colour pairs: [Latte by day, Mocha by night] ----------

  wood: D(mix(L.rose, L.sub0, 0.55), mix(P.flam, P.s1, 0.5)), woodDark: D(mix(L.sub0, L.text, 0.5), mix(P.s1, P.base, 0.4)),

  furLight: D(mix(L.rose, L.base, 0.45), mix(P.rose, P.s2, 0.3)), antler: D(mix(L.rose, L.base, 0.15), mix(P.rose, P.o1, 0.3)),
  skin: D(mix(L.rose, L.base, 0.5), mix(P.rose, P.s2, 0.15)), bear: D(mix(L.base, L.yellow, 0.08), mix(P.text, P.yellow, 0.12)),
  carrot: D(L.peach, P.peach), ginger: D(mix(L.peach, L.sub0, 0.42), mix(P.peach, P.s1, 0.45)), hay: D(mix(L.yellow, L.rose, 0.45), mix(P.yellow, P.s1, 0.5)),
  sack: D(mix(L.red, L.rose, 0.4), mix(P.red, P.s1, 0.4)),

const acc = (k, dl = 0.12, dn = 0.2) => D(mix(L[k], L.base, dl), mix(P[k], P.s0, dn));
const PASTEL = ['green', 'peach', 'sky', 'pink', 'yellow', 'lav', 'teal', 'mauve', 'flam'].map((k) => D(mix(L[k], L.base, 0.55), mix(P[k], P.s0, 0.42)));
const ACCENTS = ['red', 'green', 'blue', 'mauve', 'peach', 'teal', 'yellow'].map((k) => acc(k));
function terrainColor(x, y, z, up, c, n) {
  c.copy(pal.snow[n]);
  if (y < 1) c.copy(pal.ice[n]);
  const steep = smooth(0.8, 0.55, up) * (0.6 + 0.4 * (fbm(x * 0.02, z * 0.02, 2) * 0.5 + 0.5));

const W = createWorld({
  seed: 241224, height, keys: KEYS, tod: 0.74, sunAz: 1.9,
  terrain: { size: 4600, seg: 460, color: (x, y, z, up, c) => terrainColor(x, y, z, up, c, 0) },
  water: { radius: 2700, ice: true },
  path: (t) => { const a = t * 0.0115; return [Math.cos(a) * (365 + 85 * Math.sin(t * 0.0093)), Math.sin(a) * (355 + 80 * Math.sin(t * 0.0071 + 2))]; },
  center: new THREE.Vector3(0, 20, 0), hover: [48, 38], centerPull: 0.5, lookAhead: 30, lookDrop: 34,

const { rnd, scene, GLOW, DIM, place, plain, toWorld, groundAt, addLight, glowMat, keepClear, SIGHTS, animators, smokeSources, cur } = W;

// ---------- the day/night material: vertex colour `color` by day, `color2` by night ----------
const NM = { value: 0 };

{ // give the kit's terrain its night colours too
  const terr = scene.children.find((o) => o.isMesh && o.geometry.attributes.glow), g = terr.geometry, p = g.attributes.position, n = g.attributes.normal;
  const c2 = new Float32Array(p.count * 3), c = new THREE.Color();

const box = (w, h, d, x, y, z, k) => tint(new THREE.BoxGeometry(w, h, d).translate(x, y, z), k);

const win = (w, h, ry, lx, ly, lz, x, base, z, hry, dim = rnd() < 0.3) => (dim ? DIM : GLOW).push(place(plain(new THREE.PlaneGeometry(w, h).rotateY(ry).translate(lx, ly, lz)), x, base, z, hry));

// road ribbons that hug the ground
function ribbon(pts, width, k, lift = 0.15) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) { const [ax, az] = pts[i], [bx, bz] = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(bx - ax, bz - az) / 2.5)); for (let j = 0; j < n; j++) out.push([ax + (bx - ax) * j / n, az + (bz - az) * j / n]); }
  out.push(pts[pts.length - 1]);
  const A = [], B = [];
  for (let i = 0; i < out.length; i++) {
    const a = out[Math.max(0, i - 1)], b = out[Math.min(out.length - 1, i + 1)];
    let dx = b[0] - a[0], dz = b[1] - a[1]; const len = Math.hypot(dx, dz) || 1; dx /= len; dz /= len;
    const nx = -dz * width / 2, nz = dx * width / 2, [x, z] = out[i];
    A.push(new THREE.Vector3(x + nx, groundAt(x + nx, z + nz) + lift, z + nz)); B.push(new THREE.Vector3(x - nx, groundAt(x - nx, z - nz) + lift, z - nz));
  }
  const pos = []; for (let i = 0; i < out.length - 1; i++) pos.push(A[i], B[i], A[i + 1], B[i], B[i + 1], A[i + 1]);
  RD.push(tint(new THREE.BufferGeometry().setFromPoints(pos), k));
}

// ---------- twinkling bulbs, wires, halos, stars ----------
const BULBS = [], WIRES = [];
const BPAL = [[L.red, P.red], [L.yellow, P.yellow], [L.green, P.green], [L.blue, P.blue], [L.mauve, P.mauve], [L.peach, P.peach], [L.teal, P.teal], [L.pink, P.pink]];

function garland(a, b, sag, spacing = 2.4, size = 0.4) {
  const n = Math.max(2, Math.round(a.distanceTo(b) / spacing)); let prev = null;
  for (let i = 0; i <= n; i++) {
    const u = i / n, p = a.clone().lerp(b, u); p.y -= sag * 4 * u * (1 - u);
    if (prev) WIRES.push(prev, p);
    if (i > 0 && i < n) bulb(p, size);
    prev = p;
  }
}
function finishBulbs() {
  const n = BULBS.length, mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }), n);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), c = new THREE.Color();
  BULBS.forEach((b, i) => { mesh.setMatrixAt(i, m.compose(b.p, q, s.setScalar(b.size))); mesh.setColorAt(i, c.setRGB(1, 1, 1)); });
  scene.add(mesh);
  const wire = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(WIRES), new THREE.LineBasicMaterial({ color: L.o2.clone() }));
  scene.add(wire);
  animators.push((t, night) => {
    for (let i = 0; i < n; i++) {
      const b = BULBS[i], [d, nc] = BPAL[b.ci];
      const tw = b.chase ? 0.5 + 0.5 * Math.sin(t * 1.4 - b.p.y * 0.3 + b.ph * 0.15) : 0.5 + 0.5 * Math.sin(t * b.sp + b.ph);
      const k = (0.3 + 0.85 * tw * tw) * night, dk = 1 - night;
      c.setRGB(d.r * dk + nc.r * k, d.g * dk + nc.g * k, d.b * dk + nc.b * k);
      mesh.setColorAt(i, c);
    }

  });
}
function halo(color, size, x, y, z, dayO = 0, nightO = 0.3) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: W.soft, color, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  sp.scale.set(size, size, 1); sp.position.set(x, y, z); scene.add(sp);

}
function starGeo(r1, r2, depth) {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? r2 : r1, a = i / 10 * Math.PI * 2 + Math.PI / 2; i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r); }

// ---------- sparkles (reindeer magic): one shared particle pool ----------
const SPK = (() => {
  const N = 900, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), info = Array.from({ length: N }, () => ({ age: 9, life: 1, v: new THREE.Vector3(), c: P.yellow }));
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ map: W.soft, vertexColors: true, size: 2.8, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  pts.frustumCulled = false; scene.add(pts);

  let next = 0;

    const s = info[next]; s.age = 0; s.life = 2 + Math.random() * 2.5; s.c = tints[(Math.random() * tints.length) | 0];
    s.v.set((Math.random() - 0.5) * spread, -fall * (0.5 + Math.random()), (Math.random() - 0.5) * spread);
    pos.set([p.x, p.y, p.z], next * 3); next = (next + 1) % N;

})();

// ---------- the road network ----------
const RING = (a) => 205 + 12 * Math.sin(3 * a + 1);
const ringPt = (a) => [Math.cos(a) * RING(a), Math.sin(a) * RING(a)];
const SPOKES = [Math.PI / 2, 0.75, -0.05, -2.3, Math.PI + 0.1, 2.35];
const POLE = { x: 0, z: 96 };
const SEGS = [];                                       // [ax, az, bx, bz, halfWidth] for distance checks
function segDist(px, pz, ax, az, bx, bz) { const dx = bx - ax, dz = bz - az, u = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz))); return Math.hypot(px - ax - dx * u, pz - az - dz * u); }

{
  const ring = []; for (let i = 0; i <= 260; i++) ring.push(ringPt(i / 260 * Math.PI * 2));
  ribbon(ring, 6.5, 'road');
  for (const a of SPOKES) road([[Math.cos(a) * 79, Math.sin(a) * 79], ringPt(a)], 7);
  road([[0, -79], [0, -101]], 8);
}
// path lanterns along the roads (small, warm, no real lights)
function lantern(x, z, hgt = 4.2) {

  S.push(cyl(0.18, 0.26, hgt, 5, x, g + hgt / 2, z, 'dark'), box(0.8, 0.12, 0.8, x, g + hgt + 0.95, z, 'dark'), cone(0.6, 0.5, 4, x, g + hgt + 1.25, z, 'white'));
  DIM.push(plain(new THREE.BoxGeometry(0.55, 0.75, 0.55).translate(x, g + hgt + 0.5, z)));
}
for (const a of SPOKES) for (let r = 100, s = 1; r < RING(a) - 12; r += 24, s = -s) { const nx = -Math.sin(a), nz = Math.cos(a); lantern(Math.cos(a) * r + nx * 5 * s, Math.sin(a) * r + nz * 5 * s); }

// ---------- the square: cobbles, tree, garland tent, toy train, market, candy canes ----------
{
  for (let i = 0; i < 8; i++) RD.push(tint(new THREE.RingGeometry(i * 10, i * 10 + 10, 72, 1).rotateX(-Math.PI / 2).translate(0, G0 + 0.12, 0), i % 2 ? 'cobble' : 'cobble2'));

    box(0.7, 0.7, 0.7, 0.6, 4.0, -1.9, acc('green')), box(0.6, 0.6, 0.6, -0.6, 4.1, -1.7, acc('blue')),
  ]);
  const group = new THREE.Group(); group.add(new THREE.Mesh(sleigh, DUAL));
  const deer = [];
  [[-0.9, 6], [0.9, 6], [-0.9, 9.4], [0.9, 9.4], [-0.9, 12.8], [0.9, 12.8], [-0.9, 16.2], [0.9, 16.2], [0, 19.6]].forEach(([x, z]) => { const m = new THREE.Mesh(DEER, DUAL); m.position.set(x, 0, z); group.add(m); deer.push(m); });
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), glowMat(P.red, 1.0, 2.2)); nose.position.set(0, 3.5, 19.6 + 2.45); group.add(nose);
  const noseHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: W.soft, color: P.red, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  noseHalo.scale.set(3.5, 3.5, 1); noseHalo.position.copy(nose.position); group.add(noseHalo);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.35, 6, 4), W.winMatDim); lamp.position.set(1.5, 3.4, 2.1); group.add(lamp);
  const reins = []; for (const s of [-1, 1]) reins.push(new THREE.Vector3(s * 0.6, 2.6, 2.2), new THREE.Vector3(s * 0.9, 2.9, 19.4));
  group.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(reins), new THREE.LineBasicMaterial({ color: pal.gold[0] })));
  group.scale.setScalar(2.2); scene.add(group);
  const at = (t, v) => { const a = t * 0.05, r = 255 + 70 * Math.sin(2 * a + 1); return v.set(Math.cos(a) * r, 108 + 28 * Math.sin(3 * a + 0.5), Math.sin(a) * r); };
  const p0 = new THREE.Vector3(), p1 = new THREE.Vector3(), hv = new THREE.Vector3();
  let acc_ = 0;
  animators.push((t, night, dt) => {
    at(t, p0); at(t + 0.5, p1); group.position.copy(p0); group.lookAt(p1);
    deer.forEach((m, i) => { const g = t * 7 + i * 0.9; m.position.y = 0.35 * Math.sin(g); m.rotation.x = 0.1 * Math.sin(g + 1); });
    group.updateMatrixWorld(true);
    noseHalo.material.opacity = 0.08 + 0.4 * night * (0.75 + 0.25 * Math.sin(t * 3));
    acc_ += dt * 70;
    while (acc_ > 1) { acc_ -= 1; const m = deer[(Math.random() * deer.length) | 0]; hv.copy(HOOVES[(Math.random() * 4) | 0]); m.localToWorld(hv); SPK.emit(hv, 1.2, 2.2); }
  });
}

// ---------- pines on the hills, icebergs locked in the sea ice, polar bears ----------
{
  const geo = merged([cone(0.38, 0.5, 7, 0, 0.35, 0, 'pine'), cone(0.2, 0.18, 7, 0, 0.52, 0, 'snow'), cone(0.28, 0.42, 7, 0, 0.62, 0, 'pine'), cone(0.15, 0.15, 7, 0, 0.78, 0, 'snow'), cone(0.16, 0.3, 7, 0, 0.88, 0, 'snow'), cyl(0.05, 0.06, 0.15, 5, 0, 0.07, 0, 'woodDark')]);
  const MAX = 7000, mesh = new THREE.InstancedMesh(geo, DUAL, MAX);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3(), e = new THREE.Euler(), c = new THREE.Color();
  let n = 0;
  for (let i = 0; i < 90000 && n < MAX; i++) {
    const x = (rnd() - 0.5) * 2000, z = (rnd() - 0.5) * 2000, h = height(x, z), r = Math.hypot(x, z);
    if (h < 3 || r < 120 || W.slopeAt(x, z, 3) > 0.7) continue;
    if (fbm(x * 0.006 + 9, z * 0.006, 3) < (r < 235 ? 0.28 : -0.1)) continue;
    if (roadDist(x, z) < 8 || keepClear.some((k) => Math.hypot(k.x - x, k.z - z) < k.r)) continue;
    const ht = (r < 235 ? 8 : 10) + rnd() * 13; s.set(ht, ht, ht);
    m.compose(v.set(x, h - 1, z), q.setFromEuler(e.set(0, rnd() * 6.28, 0)), s); mesh.setMatrixAt(n, m);
    mesh.setColorAt(n, c.setScalar(0.85 + rnd() * 0.15)); n++;
  }
  mesh.count = n; scene.add(mesh);
  for (let i = 0, k = 0; i < 3000 && k < 30; i++) {
    const a = rnd() * 6.28, r = 820 + rnd() * 600, x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (height(x, z) > -10) continue;
    const sx = 10 + rnd() * 25;
    S.push(tint(new THREE.IcosahedronGeometry(1, 0).scale(sx, 4 + rnd() * 12, sx * (0.6 + rnd() * 0.6)).rotateY(rnd() * 6.28).translate(x, 0, z), 'ice')); k++;
  }
  // a polar bear and her cub ambling along the shore ice
  const bearGeo = merged([box(2.2, 1.8, 3.8, 0, 2.1, 0, 'bear'), box(1.6, 1.4, 1.6, 0, 2.4, 2.4, 'bear'), box(1.0, 0.9, 1.3, 0, 2.3, 3.6, 'bear'), box(0.4, 0.35, 0.3, 0, 2.35, 4.3, 'dark'),
    box(0.35, 0.35, 0.2, -0.4, 2.95, 3.2, 'bear'), box(0.35, 0.35, 0.2, 0.4, 2.95, 3.2, 'bear'), ...[[-0.65, -1.2], [0.65, -1.2], [-0.65, 1.2], [0.65, 1.2]].map(([x, z]) => box(0.6, 1.4, 0.7, x, 0.7, z, 'bear'))]);
  const bears = [1, 0.55].map((s) => { const b = new THREE.Mesh(bearGeo, DUAL); b.scale.setScalar(s * 2.2); scene.add(b); return b; });
  animators.push((t) => {
    bears.forEach((b, i) => {
      const a = 0.35 + t * 0.0016 - i * 0.012, r = 880 + 25 * Math.sin(t * 0.01) + i * 6;
      b.position.set(Math.cos(a) * r, 0.1 + Math.abs(Math.sin(t * 1.6 + i)) * 0.3, Math.sin(a) * r); b.rotation.set(0, Math.atan2(-Math.sin(a), Math.cos(a)) + Math.PI, Math.sin(t * 1.6 + i) * 0.04);
    });
  });
}

// ---------- aurora curtains ----------
const auroraMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  uniforms: { time: { value: 0 }, strength: { value: 0 }, cLow: { value: mix(P.teal, P.green, 0.35) }, cHigh: { value: mix(P.mauve, P.pink, 0.4) } },
  vertexShader: `uniform float time; attribute float seed; varying vec2 vUv; varying float vSeed;
    void main(){ vUv = uv; vSeed = seed; vec3 p = position;
      p.z += sin(p.x * 0.0022 + time * 0.05 + seed) * 220.0 + sin(p.x * 0.0061 - time * 0.09 + seed * 2.0) * 90.0;
      p.y += sin(p.x * 0.003 + time * 0.07 + seed) * 60.0 * uv.y;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`,
  fragmentShader: `uniform float time, strength; uniform vec3 cLow, cHigh; varying vec2 vUv; varying float vSeed;
    float h11(float n){ return fract(sin(n) * 43758.5453); }
    float vnoise(float x){ float i = floor(x), f = fract(x); return mix(h11(i), h11(i + 1.0), f * f * (3.0 - 2.0 * f)); }
    void main(){
      float x = vUv.x * 60.0 + vSeed * 10.0;
      float rays = 0.45 + 0.55 * vnoise(x * 2.3 + time * 0.25) * vnoise(x * 0.7 - time * 0.12 + 5.0);
      float bottom = smoothstep(0.0, 0.08, vUv.y), topFade = 1.0 - smoothstep(0.35, 1.0, vUv.y);
      float ends = smoothstep(0.0, 0.15, vUv.x) * smoothstep(1.0, 0.85, vUv.x);
      float pulse = 0.7 + 0.3 * sin(time * 0.15 + vSeed * 3.0 + vUv.x * 4.0);
      vec3 col = mix(cLow, cHigh, smoothstep(0.15, 0.85, vUv.y));
      float a = rays * bottom * topFade * ends * pulse * strength;
      gl_FragColor = vec4(col * a * 1.1, 1.0);
    }`,
});
{
  for (let i = 0; i < 7; i++) {
    const g = new THREE.PlaneGeometry(4600, 1300, 160, 8);
    g.setAttribute('seed', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count).fill(i * 1.7 + 0.3), 1));
    const m = new THREE.Mesh(g, auroraMat), a = i / 7 * Math.PI * 2 + 0.3, d = 4300 + (i % 3) * 300;
    m.position.set(Math.cos(a) * d, 850 + (i % 3) * 140, Math.sin(a) * d); m.lookAt(0, 900, 0);
    m.renderOrder = -1; m.frustumCulled = false; scene.add(m);
  }
  const lowC = mix(P.teal, P.green, 0.35), highC = mix(P.mauve, P.pink, 0.4);
  animators.push((t, night, dt, e) => {
    auroraMat.uniforms.time.value = t; auroraMat.uniforms.strength.value = cur.aurora;
    const shift = 0.5 + 0.5 * Math.sin(t * 0.03), pulse = 0.85 + 0.15 * Math.sin(t * 0.15) * Math.sin(t * 0.07 + 1);
    W.moonLight.color.copy(lowC).lerp(highC, shift * 0.6);
    W.moonLight.intensity = 1.1 * cur.aurora * pulse * smooth(0.02, -0.2, e);
    W.moonLight.position.set(Math.cos(t * 0.004) * 600, 500, Math.sin(t * 0.004) * 600);
  });
}

// ---------- mist over the sea ice, clouds on the far ranges, snowfall ----------
for (let i = 0, k = 0; i < 4000 && k < 50; i++) {
  const a = rnd() * 6.28, r = 700 + rnd() * 700, x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (height(x, z) > 0) continue;
  W.drifter('mist', 0.1 + rnd() * 0.08, 240 + rnd() * 200, 40 + rnd() * 25, x, 10 + rnd() * 14, z, 0.004 + rnd() * 0.004, 0.95 + rnd() * 0.1); k++;
}
for (let i = 0; i < 30; i++) {
  const a = rnd() * 6.28, r = 1500 + rnd() * 600;
  W.drifter('cloud', 0.16 + rnd() * 0.14, 420 + rnd() * 300, 90 + rnd() * 50, Math.cos(a) * r, 520 + rnd() * 220, Math.sin(a) * r, 0.004 + rnd() * 0.004, 0.9 + rnd() * 0.15);
}
W.particles({ count: 1100, size: 1.3, color: L.base, box: 260, fall: 7, sway: 2, dayScale: 1, nightScale: 0.5 });

// ---------- softer windows and the Latte-to-Mocha switch (runs after the kit's own light update) ----------
{
  const winDay = mix(L.s1, L.sapph, 0.25), winNight = mix(P.yellow, P.peach, 0.25).multiplyScalar(1.02), dimDay = mix(L.s1, L.lav, 0.2), dimNight = mix(P.peach, P.maroon, 0.2).multiplyScalar(0.8);
  const gDay = mix(L.base, L.rose, 0.15), gNight = mix(P.s0, P.s1, 0.5);
  animators.push((t, night) => {
    NM.value = smooth(0.12, 0.85, night);
    W.hemi.groundColor.copy(gDay).lerp(gNight, night);                        // snow bounces light up onto the walls by day
    W.winMat.color.copy(winDay).lerp(winNight, night); W.winMatDim.color.copy(dimDay).lerp(dimNight, night);
  });
}

finishBulbs();
scene.add(new THREE.Mesh(mergeGeometries(S), DUAL));
scene.add(new THREE.Mesh(mergeGeometries(RD), ROADMAT));
// ---------- fireworks on the hour: one burst per hour (1-12) over the square, a rocket rising before each ----------
{
  const PER = 110, RISE = 1.2, LIFE = 3.2, COLS = ['red', 'peach', 'yellow', 'green', 'teal', 'sky', 'mauve', 'pink'];
  const shells = Array.from({ length: 12 }, () => {
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PER * 3), 3));
    const pts = new THREE.Points(g, new THREE.PointsMaterial({ map: W.soft, size: 6, transparent: true, opacity: 0, depthWrite: false, fog: false }));
    pts.frustumCulled = false; pts.visible = false; scene.add(pts);
    return { pts, vel: new Float32Array(PER * 3), at: 0, x: 0, y: 0, z: 0, x0: 0, z0: 0, col: 'red' };
  });
  animators.push((t, night) => {
    if (W.clock.struck) {
      const n = W.clock.c.h % 12 || 12, rand = Math.random;
      for (let k = 0; k < n; k++) {
        const s = shells[k], a = rand() * 6.28, r = 20 + rand() * 45;
        Object.assign(s, { at: t + RISE + 1 + k * 1.7, x: Math.cos(a) * r, z: Math.sin(a) * r, y: G0 + 120 + rand() * 50, x0: Math.cos(a) * 46, z0: Math.sin(a) * 46, col: COLS[(rand() * COLS.length) | 0] });
        for (let i = 0; i < PER; i++) {                 // even-ish sphere of directions, a little speed jitter
          const u = rand() * 2 - 1, ph = rand() * 6.28, q = Math.sqrt(1 - u * u), v = 85 + rand() * 15;
          s.vel.set([Math.cos(ph) * q * v, u * v, Math.sin(ph) * q * v], i * 3);
        }
        s.pts.visible = true;
      }
    }
    for (const s of shells) {
      if (!s.pts.visible) continue;
      const a = t - s.at, arr = s.pts.geometry.attributes.position.array, m = s.pts.material;
      if (a > LIFE) { s.pts.visible = false; continue; }
      m.blending = night > 0.5 ? THREE.AdditiveBlending : THREE.NormalBlending;
      if (a < 0) {                                      // the rocket: all sparks in one point, climbing from the lamp ring
        if (a < -RISE) { m.opacity = 0; continue; }
        const k = smooth(-RISE, 0, a), x = s.x0 + (s.x - s.x0) * k, y = G0 + 9 + (s.y - G0 - 9) * k, z = s.z0 + (s.z - s.z0) * k;
        for (let i = 0; i < PER; i++) arr.set([x, y, z], i * 3);
        m.size = 6; m.opacity = 0.9; m.color.copy(P.peach).multiplyScalar(1 + night);
      } else {
        const d = (1 - Math.exp(-a * 2.6)) / 2.6, fall = 4 * a * a;
        for (let i = 0; i < PER; i++) arr.set([s.x + s.vel[i * 3] * d, s.y + s.vel[i * 3 + 1] * d - fall, s.z + s.vel[i * 3 + 2] * d], i * 3);
        m.size = 11; m.opacity = smooth(0, 0.15, a) * smooth(LIFE, LIFE * 0.35, a) * (0.85 + 0.15 * Math.sin(a * 30));
        m.color.copy(L[s.col]).lerp(P[s.col].clone().multiplyScalar(1.8), night);
      }
      s.pts.geometry.attributes.position.needsUpdate = true;
    }
  });
}

W.finish();
window.W = W;   // debug handle for the browser console
</script>
