<!doctype html>
<html><head><meta charset="utf-8"><title>Observatory Ridge (3D)</title>
<style>html,body{margin:0;height:100%;background:#11111b;overflow:hidden}canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<!-- lib/ holds three.js r170 (MIT) and addons; kit3d.js is the shared engine (master copy in tools/kit3d) -->
</head><body>
<script type="module">
// A snowy ridge crowned with observatory domes and a radio-dish array, frozen tarns below, a research station
// and a cable car. Catppuccin Latte by day (blinding snow, blue shadows); Mocha by night, when the domes open
// and an aurora ripples over the peaks and reflects in the ice. URL options: see kit3d.js.
import { createWorld, THREE, mergeGeometries, P, L, mix, smooth, fbm, ridged } from './kit3d.js';

const sq = (v) => v * v;
function height(x, z) {
  const r = Math.hypot(x, z), zc = z - 60 * Math.sin(x * 0.003);
  const along = Math.exp(-Math.pow(x / 620, 4));
  let h = 270 * Math.exp(-sq(zc / 170)) * along * (0.8 + 0.35 * ridged(x * 0.006, z * 0.006, 4));
  h -= 70 * Math.exp(-sq((x - 180) / 90)) * Math.exp(-sq(zc / 120));            // saddle for the dish array
  h += 45 * (fbm(x * 0.004 + 10, z * 0.004, 4) * 0.5 + 0.5);
  h -= 95 * Math.exp(-(sq(x - 260) + sq(z - 470)) / sq(150));                   // frozen tarns
  h -= 95 * Math.exp(-(sq(x + 380) + sq(z + 430)) / sq(160));
  h -= 70 * Math.exp(-(sq(x + 620) + sq(z - 300)) / sq(140));
  h += 520 * smooth(1050, 1600, r) * (0.35 + 0.8 * ridged(x * 0.0035 + 3, z * 0.0035, 4));
  h += 6 * fbm(x * 0.03, z * 0.03, 2);
  return h - 10;
}

// ---------- time of day: Latte snow by day, Mocha night with aurora ----------
const NIGHT = { top: mix(P.crust, P.base, 0.5), mid: mix(P.base, P.s0, 0.45), hor: mix(P.s0, P.s1, 0.4).lerp(P.blue, 0.05), glow: P.s1, disc: P.lav,
  light: P.lav, lightI: 0, hemi: mix(P.teal, P.lav, 0.55), hemiI: 0.45, cloud: mix(P.s1, P.s2, 0.4), mist: mix(P.s1, P.o0, 0.35),
  water: mix(P.s0, P.sapph, 0.12), fogD: 0.00045, stars: 1, win: 1, snow: 0.2, aurora: 1 };
const KEYS = [
  { e: -1, ...NIGHT }, { e: -0.3, ...NIGHT },
  { e: -0.08, top: mix(P.base, P.s1, 0.5), mid: mix(P.s1, P.lav, 0.25), hor: mix(P.lav, P.pink, 0.3).lerp(P.s1, 0.45), glow: mix(P.pink, P.peach, 0.4),
    disc: P.peach, light: P.pink, lightI: 0, hemi: mix(P.lav, P.blue, 0.4), hemiI: 0.8, cloud: mix(P.lav, P.s2, 0.45), mist: mix(P.o0, P.lav, 0.25),
    water: mix(P.s1, P.lav, 0.2), fogD: 0.0005, stars: 0.45, win: 0.95, snow: 0.3, aurora: 0.25 },
  { e: 0.06, top: mix(L.lav, L.base, 0.45), mid: mix(L.pink, L.base, 0.65), hor: mix(L.rose, L.base, 0.6), glow: mix(L.peach, L.base, 0.4),
    disc: mix(L.yellow, L.base, 0.3), light: mix(L.peach, L.base, 0.5), lightI: 1.5, hemi: mix(L.lav, L.base, 0.6), hemiI: 1.05,
    cloud: mix(L.pink, L.base, 0.6), mist: L.base, water: mix(L.lav, L.base, 0.45), fogD: 0.0004, stars: 0.08, win: 0.5, snow: 0.3, aurora: 0 },
  { e: 0.3, top: mix(L.blue, L.base, 0.45), mid: mix(L.sky, L.base, 0.65), hor: mix(L.base, L.sky, 0.08), glow: L.base, disc: L.base,
    light: L.base, lightI: 1.6, hemi: mix(L.sky, L.base, 0.55), hemiI: 1.15, cloud: L.base, mist: L.base, water: mix(L.sky, L.base, 0.5),
    fogD: 0.00028, stars: 0, win: 0.05, snow: 0.06, aurora: 0 },
  { e: 1, top: mix(L.blue, L.base, 0.38), mid: mix(L.sky, L.base, 0.6), hor: mix(L.base, L.sky, 0.1), glow: L.base, disc: L.base,
    light: L.base, lightI: 1.7, hemi: mix(L.sky, L.base, 0.5), hemiI: 1.2, cloud: L.base, mist: L.base, water: mix(L.sky, L.base, 0.45),
    fogD: 0.00025, stars: 0, win: 0, snow: 0.05, aurora: 0 },
];

const snow = L.base, rockC = mix(L.s1, L.o1, 0.45), iceShore = mix(L.base, L.sky, 0.1);
const W = createWorld({
  seed: 777001, height, keys: KEYS, tod: 0.7, sunAz: 1.4,
  terrain: { size: 4200, seg: 420, color(x, y, z, up, c) {
    c.copy(snow);
    if (y < 2) c.copy(iceShore);
    const steep = smooth(0.78, 0.55, up) * (0.6 + 0.4 * (fbm(x * 0.02, z * 0.02, 2) * 0.5 + 0.5));
    c.lerp(rockC, steep);
    return 0.5 * (1 - steep);
  } },
  water: { radius: 2400, ice: true },
  path: (t) => { const a = t * 0.0055; return [Math.cos(a) * (900 + 40 * Math.sin(t * 0.01)), Math.sin(a) * (760 + 40 * Math.sin(t * 0.013 + 2))]; },
  center: new THREE.Vector3(0, 230, 0), hover: [150, 70], centerPull: 0.4, lookDrop: 70,
  houseTones: { walls: [mix(L.base, L.sapph, 0.12), mix(L.base, L.maroon, 0.15), L.mantle], roofs: [L.s0, mix(L.s1, L.sapph, 0.2)] },
  bloom: { threshold: 0.96, day: 0.2, night: 0.7 },
  groundLight: mix(P.s0, P.s1, 0.5), moonI: 0.75, noMoon: true,   // no moon: the aurora lights the night
});
const { rnd, scene, SOLID, GLOW, DIM, place, tinted, plain, toWorld, groundMin, house, addLight, glowMat, keepClear, SIGHTS, animators, slopeAt, cur } = W;
const workRed = glowMat(P.red, 0.4, 3.5);
const white = L.mantle, band = mix(L.sapph, L.base, 0.35);

// crest point near a given x (highest z along the ridge)
function crestAt(x) { let best = { z: 0, h: -1e9 }; for (let z = -300; z <= 300; z += 3) { const h = height(x, z); if (h > best.h) best = { z, h }; } return { x, z: best.z, h: best.h }; }
function blinker(x, y, z, speed = 1.6, phase = 0) {
  const mat = workRed.clone(); const m = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 6), mat); m.position.set(x, y, z); scene.add(m);
  animators.push((t, night) => { const b = Math.pow(Math.max(0, Math.sin(t * speed + phase)), 10); mat.color.copy(P.red).multiplyScalar(0.3 + (1 + 5 * night) * b); });
}

// ---------- observatory domes along the crest ----------
const domes = [];
function dome(x, z, R) {
  const base = groundMin(x, z, 0, R * 2.2, R * 2.2) - 1.5, H = R * 0.9 + 1.5;
  SOLID.push(tinted(new THREE.CylinderGeometry(R, R * 1.06, H, 24).translate(x, base + H / 2, z), white));
  SOLID.push(tinted(new THREE.CylinderGeometry(R * 1.02, R * 1.02, 1.2, 24).translate(x, base + H - 0.8, z), band));
  SOLID.push(tinted(new THREE.BoxGeometry(R * 1.6, R * 0.5, R * 1.2).translate(x + R * 1.1, base + R * 0.25 + 1.5, z), white));   // annexe
  GLOW.push(plain(new THREE.PlaneGeometry(1.6, 1.4).translate(x + R * 1.1, base + R * 0.3 + 1.6, z + R * 0.61)));
  const g = new THREE.Group(); g.position.set(x, base + H, z);
  const shell = new THREE.Mesh(new THREE.SphereGeometry(R, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshLambertMaterial({ color: L.base, flatShading: true }));
  const slitMat = new THREE.MeshLambertMaterial({ color: L.s0.clone(), emissive: new THREE.Color(0, 0, 0), flatShading: true });
  const slit = new THREE.Mesh(new THREE.SphereGeometry(R * 1.015, 6, 10, -0.17, 0.34, 0, Math.PI / 2), slitMat);
  g.add(shell, slit); g.rotation.y = rnd() * 6.28; scene.add(g);
  const top = new THREE.Vector3(x, base + H + R, z);
  domes.push({ g, slitMat, sp: (rnd() < 0.5 ? 1 : -1) * (0.008 + rnd() * 0.01) });
  return { base, top };
}
{
  const spots = [[-400, 16], [-150, 24], [430, 15]].map(([x, R]) => ({ ...crestAt(x), R }));
  for (const s of spots) {
    const d = dome(s.x, s.z, s.R);
    keepClear.push({ x: s.x, z: s.z, r: s.R * 2.5 });
    SIGHTS.push(new THREE.Vector3(s.x, d.top.y - s.R, s.z));
    blinker(s.x + s.R * 1.1, d.base + s.R * 0.5 + 2.3, s.z, 1.3, s.x);
  }
  animators.push((t, night, dt) => {
    const open = smooth(0.4, 0.9, night);
    for (const d of domes) {
      d.slitMat.color.copy(L.s0).lerp(P.crust, open); d.slitMat.emissive.copy(P.red).multiplyScalar(0.12 * open);
      d.g.rotation.y += d.sp * dt * open;                              // tracking the sky while open
    }
  });
}

// ---------- radio-dish array on the saddle ----------
{
  const c = crestAt(180), dishes = [];
  const prof = []; for (let i = 0; i <= 8; i++) { const rr = i * 0.9; prof.push(new THREE.Vector2(rr, rr * rr / 14)); }
  const dishGeo = new THREE.LatheGeometry(prof, 20);
  const dishMat = new THREE.MeshLambertMaterial({ color: L.base, side: THREE.DoubleSide, flatShading: true });
  for (let k = -1.5; k <= 1.5; k++) {
    const x = c.x + k * 26, z = crestAt(x).z + 6, base = groundMin(x, z, 0, 6, 6) - 1;
    SOLID.push(tinted(new THREE.CylinderGeometry(1, 1.6, 9, 8).translate(x, base + 4.5, z), white));
    const az = new THREE.Group(); az.position.set(x, base + 9, z);
    const el = new THREE.Group(); el.rotation.x = -0.9; az.add(el);
    const dish = new THREE.Mesh(dishGeo, dishMat); el.add(dish);
    const feed = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6), new THREE.MeshLambertMaterial({ color: L.o1 })); feed.position.y = 3; el.add(feed);
    az.rotation.y = 0.6 + k * 0.05; scene.add(az); dishes.push(az);
    blinker(x, base + 15.5, z, 0.9, k * 1.7);
  }
  animators.push((t) => { dishes.forEach((d, i) => { d.rotation.y = 0.6 + 0.5 * Math.sin(t * 0.01 + i * 0.05); }); });
  keepClear.push({ x: c.x, z: c.z, r: 60 });
  SIGHTS.push(new THREE.Vector3(c.x, c.h + 8, c.z));
}

// ---------- research station by the eastern tarn, with an antenna mast ----------
const station = W.findSpot({ a: Math.atan2(470, 260) - 0.25, spread: 0.3, rMin: 380, rMax: 520, hMin: 4, hMax: 60, flatR: 20 });
if (station) {
  const placed = [];
  for (let i = 0, n = 0; i < 300 && n < 6; i++) {
    const a = rnd() * 6.28, d = n ? 14 + rnd() * 26 : 0, x = station.x + Math.cos(a) * d, z = station.z + Math.sin(a) * d;
    if (height(x, z) < 3 || slopeAt(x, z) > 0.5 || placed.some((p) => Math.hypot(p.x - x, p.z - z) < 14)) continue;
    house(x, z, Math.atan2(-x, -z) + (rnd() - 0.5) * 0.4, 12 + rnd() * 4, 8 + rnd() * 2, 5 + rnd() * 2, { lit: true, smoke: n < 2, roofH: 2.5 });
    placed.push({ x, z }); n++;
  }
  const mx = station.x + 22, mz = station.z - 12, mb = height(mx, mz);
  SOLID.push(tinted(new THREE.CylinderGeometry(0.3, 0.6, 30, 5).translate(mx, mb + 15, mz), L.o1));
  blinker(mx, mb + 30.8, mz, 2.0);
  for (let k = 0; k < 4; k++) { const a = k * 1.57 + 0.3, x = station.x + Math.cos(a) * 32, z = station.z + Math.sin(a) * 32, h = height(x, z); if (h > 2) { SOLID.push(tinted(new THREE.CylinderGeometry(0.15, 0.2, 5).translate(x, h + 2.5, z), L.o1)); GLOW.push(plain(new THREE.SphereGeometry(0.55, 6, 4).translate(x, h + 5.3, z))); } }
  addLight(P.yellow, 500, 90, station.x, station.h + 18, station.z);
  keepClear.push({ x: station.x, z: station.z, r: 55 });
  SIGHTS.push(new THREE.Vector3(station.x, station.h + 6, station.z));
}

// ---------- cable car from the station up to the main dome ----------
if (station) {
  const topC = crestAt(-150), topP = new THREE.Vector3(topC.x + 30, 0, topC.z + 20);
  topP.y = height(topP.x, topP.z) + 10;
  const botP = new THREE.Vector3(station.x - 25, 0, station.z - 20); botP.y = height(botP.x, botP.z) + 10;
  const sup = [botP];
  for (const f of [0.33, 0.66]) {                                     // pylons tall enough to clear the slope
    const p = botP.clone().lerp(topP, f); let g = -1e9;
    for (let k = -8; k <= 8; k++) { const q = botP.clone().lerp(topP, f + k * 0.02); g = Math.max(g, height(q.x, q.z)); }
    p.y = Math.max(p.y, g + 22); sup.push(p);
  }
  sup.push(topP);
  for (const p of [botP, topP]) { const gh = height(p.x, p.z); SOLID.push(tinted(new THREE.BoxGeometry(10, p.y - gh + 3, 8).translate(p.x, (p.y + gh) / 2 - 1, p.z), mix(L.base, L.maroon, 0.15))); GLOW.push(plain(new THREE.SphereGeometry(0.6, 6, 4).translate(p.x, p.y + 2.5, p.z))); }
  for (const p of sup.slice(1, -1)) { const gh = height(p.x, p.z); SOLID.push(tinted(new THREE.CylinderGeometry(0.6, 1.2, p.y - gh + 2, 6).translate(p.x, (p.y + gh) / 2, p.z), L.o1)); SOLID.push(tinted(new THREE.BoxGeometry(5, 0.6, 0.6).translate(p.x, p.y + 0.5, p.z), L.o1)); }
  const cable = new THREE.Line(new THREE.BufferGeometry().setFromPoints(sup), new THREE.LineBasicMaterial({ color: mix(L.text, L.o2, 0.3) }));
  scene.add(cable);
  const segLen = []; let total = 0; for (let i = 1; i < sup.length; i++) { const d = sup[i].distanceTo(sup[i - 1]); segLen.push(d); total += d; }
  const along = (s) => { let d = s * total; for (let i = 0; i < segLen.length; i++) { if (d <= segLen[i]) return sup[i].clone().lerp(sup[i + 1], d / segLen[i]); d -= segLen[i]; } return sup[sup.length - 1].clone(); };
  const cabins = [0, 0.5].map((ph) => {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.BoxGeometry(4.5, 3.4, 3.4).translate(0, -4.5, 0), new THREE.MeshLambertMaterial({ color: mix(L.maroon, L.base, 0.35), flatShading: true })));
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3).translate(0, -1.5, 0), new THREE.MeshLambertMaterial({ color: L.o1 })));
    for (const sz of [1, -1]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 1.4), W.winMatDim); w.position.set(0, -4.1, sz * 1.72); w.rotation.y = sz > 0 ? 0 : Math.PI; g.add(w); }
    scene.add(g); return { g, ph };
  });
  const cycle = 140;
  animators.push((t) => {
    for (const c of cabins) {
      const k = ((t / cycle + c.ph) % 1), s = k < 0.5 ? smooth(0.04, 0.46, k) : 1 - smooth(0.54, 0.96, k);
      c.g.position.copy(along(s)); c.g.rotation.y = Math.atan2(topP.x - botP.x, topP.z - botP.z) + Math.PI / 2;
    }
  });
  SIGHTS.push(new THREE.Vector3(sup[2].x, sup[2].y, sup[2].z));
}

// ---------- snowy pines on the lower slopes ----------
{
  const dark = mix(L.teal, L.o2, 0.55), cap = L.base;
  const parts = [
    tinted(new THREE.ConeGeometry(0.38, 0.5, 7).translate(0, 0.35, 0), dark), tinted(new THREE.ConeGeometry(0.2, 0.18, 7).translate(0, 0.52, 0), cap),
    tinted(new THREE.ConeGeometry(0.28, 0.42, 7).translate(0, 0.62, 0), dark), tinted(new THREE.ConeGeometry(0.15, 0.15, 7).translate(0, 0.78, 0), cap),
    tinted(new THREE.ConeGeometry(0.16, 0.3, 7).translate(0, 0.88, 0), cap),
  ];
  const geo = mergeGeometries(parts.map((g) => g.index ? g.toNonIndexed() : g));
  const MAX = 9000, mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }), MAX);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3(), e = new THREE.Euler(), c = new THREE.Color();
  let n = 0;
  for (let i = 0; i < 90000 && n < MAX; i++) {
    const x = (rnd() - 0.5) * 2600, z = (rnd() - 0.5) * 2600, h = height(x, z);
    if (h < 3 || h > 150 + 40 * fbm(x * 0.01, z * 0.01, 2) || slopeAt(x, z, 3) > 0.7) continue;
    if (fbm(x * 0.005 + 9, z * 0.005, 3) < -0.05) continue;
    if (keepClear.some((k) => Math.hypot(k.x - x, k.z - z) < k.r)) continue;
    const ht = 12 + rnd() * 14; s.set(ht, ht, ht);
    m.compose(v.set(x, h - 1, z), q.setFromEuler(e.set(0, rnd() * 6.28, 0)), s); mesh.setMatrixAt(n, m);
    mesh.setColorAt(n, c.setScalar(0.85 + rnd() * 0.15)); n++;
  }
  mesh.count = n; scene.add(mesh);
}

// ---------- aurora curtains ----------
const auroraMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  uniforms: { time: { value: 0 }, strength: { value: 0 }, cLow: { value: mix(P.teal, P.green, 0.35) }, cHigh: { value: mix(P.mauve, P.pink, 0.4) } },
  vertexShader: `uniform float time; attribute float seed; varying vec2 vUv; varying float vSeed;
    void main(){ vUv = uv; vSeed = seed; vec3 p = position;
      p.z += sin(p.x * 0.0022 + time * 0.05 + seed) * 220.0 + sin(p.x * 0.0061 - time * 0.09 + seed * 2.0) * 90.0;
      p.y += sin(p.x * 0.003 + time * 0.07 + seed) * 60.0 * uv.y;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`,
  fragmentShader: `uniform float time, strength; uniform vec3 cLow, cHigh; varying vec2 vUv; varying float vSeed;
    float h11(float n){ return fract(sin(n) * 43758.5453); }
    float vnoise(float x){ float i = floor(x), f = fract(x); return mix(h11(i), h11(i + 1.0), f * f * (3.0 - 2.0 * f)); }
    void main(){
      float x = vUv.x * 60.0 + vSeed * 10.0;
      float rays = 0.45 + 0.55 * vnoise(x * 2.3 + time * 0.25) * vnoise(x * 0.7 - time * 0.12 + 5.0);
      float bottom = smoothstep(0.0, 0.08, vUv.y), topFade = 1.0 - smoothstep(0.35, 1.0, vUv.y);
      float ends = smoothstep(0.0, 0.15, vUv.x) * smoothstep(1.0, 0.85, vUv.x);
      float pulse = 0.7 + 0.3 * sin(time * 0.15 + vSeed * 3.0 + vUv.x * 4.0);
      vec3 col = mix(cLow, cHigh, smoothstep(0.15, 0.85, vUv.y));
      float a = rays * bottom * topFade * ends * pulse * strength;
      gl_FragColor = vec4(col * a * 1.25, 1.0);
    }`,
});
{
  for (let i = 0; i < 7; i++) {                                         // a ring of curtains: one is always behind the ridge
    const g = new THREE.PlaneGeometry(4600, 1300, 160, 8);
    g.setAttribute('seed', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count).fill(i * 1.7 + 0.3), 1));
    const m = new THREE.Mesh(g, auroraMat), a = i / 7 * Math.PI * 2 + 0.3, d = 4300 + (i % 3) * 300;
    m.position.set(Math.cos(a) * d, 850 + (i % 3) * 140, Math.sin(a) * d); m.lookAt(0, 900, 0);
    m.renderOrder = -1; m.frustumCulled = false; scene.add(m);
  }
  // the aurora is the night's light source: the snow takes on its slowly shifting teal-to-mauve glow
  const lowC = mix(P.teal, P.green, 0.35), highC = mix(P.mauve, P.pink, 0.4);
  animators.push((t, night, dt, e) => {
    auroraMat.uniforms.time.value = t; auroraMat.uniforms.strength.value = cur.aurora;
    const shift = 0.5 + 0.5 * Math.sin(t * 0.03), pulse = 0.85 + 0.15 * Math.sin(t * 0.15) * Math.sin(t * 0.07 + 1);
    W.moonLight.color.copy(lowC).lerp(highC, shift * 0.6);
    W.moonLight.intensity = 1.1 * cur.aurora * pulse * smooth(0.02, -0.2, e);
    W.moonLight.position.set(Math.cos(t * 0.004) * 600, 500, Math.sin(t * 0.004) * 600);
  });
}

// ---------- mist in the valleys, clouds on the peaks, gentle snowfall ----------
for (let i = 0, k = 0; i < 4000 && k < 80; i++) {
  const a = rnd() * 6.28, r = 300 + rnd() * 700, x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (height(x, z) > 25) continue;
  W.drifter('mist', 0.12 + rnd() * 0.08, 220 + rnd() * 200, 40 + rnd() * 25, x, 12 + rnd() * 14, z, 0.004 + rnd() * 0.004, 0.95 + rnd() * 0.1); k++;
}
for (let i = 0; i < 30; i++) {
  const a = rnd() * 6.28, r = 1100 + rnd() * 600;
  W.drifter('cloud', 0.16 + rnd() * 0.14, 380 + rnd() * 300, 80 + rnd() * 50, Math.cos(a) * r, 420 + rnd() * 220, Math.sin(a) * r, 0.004 + rnd() * 0.004, 0.9 + rnd() * 0.15);
}
W.particles({ count: 900, size: 1.3, color: L.base, box: 280, fall: 8, sway: 2, dayScale: 1, nightScale: 0.45 });

W.finish();
</script>
</body></html>
