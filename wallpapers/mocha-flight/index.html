<script type="module">
// A slow flight around a snowy peak with a full day/night cycle: procedural terrain, pine forest, mirrored lakes,
// a mountain village whose windows light up at dusk, a cabin, a boat, birds, fireflies in the woods and shooting stars,
// in the Catppuccin Mocha palette.
// URL options: ?speed=1 (flight speed)  ?t=0 (start offset, seconds)  ?day=60 (minutes per day)

const P = {

  sapph: C(0x74c7ec), pink: C(0xf5c2e7), flam: C(0xf2cdcd), rose: C(0xf5e0dc), peach: C(0xfab387),
  mauve: C(0xcba6f7), yellow: C(0xf9e2af), maroon: C(0xeba0ac), green: C(0xa6e3a1),

const mix = (a, b, t) => a.clone().lerp(b, t);

// seeded random, so the village, forest and cabin stay in the same place on every load
let seed = 1234567;
const rnd = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// ---------- noise ----------
function hash(ix, iz) {

  h = Math.imul(h ^ (h >>> 13), 1274126177);

}
function noise(x, z) {

  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);

  let s = 0, amp = 0.5, n = 0;
  for (let i = 0; i < oct; i++) {

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------- terrain shape ----------
// Peak in the centre, a ring valley with lakes around it (the flight path), outer ridges beyond.
function height(x, z) {
  const r = Math.hypot(x, z);
  let h = 0;
  const pk = Math.exp(-Math.pow(r / 185, 1.3));
  h += 640 * pk * (0.72 + 0.4 * ridged(x * 0.0065, z * 0.0065, 5));
  h += 75 * (fbm(x * 0.004 + 10, z * 0.004, 5) * 0.5 + 0.5);
  const lake = fbm(x * 0.0028, z * 0.0028 + 5, 3) * 0.5 + 0.5;
  h -= 105 * Math.exp(-Math.pow((r - 680) / 210, 2)) * (0.45 + 0.9 * lake);
  h += 330 * smooth(980, 1500, r) * (0.5 + 0.6 * (fbm(x * 0.003 + 40, z * 0.003, 4) * 0.5 + 0.5));
  h += 140 * smooth(1030, 1550, r) * ridged(x * 0.008 + 3, z * 0.008, 4);

}

// ---------- time of day ----------

    light: P.lav, lightI: 0, hemi: mix(P.lav, P.blue, 0.3), hemiI: 0.6, cloud: mix(P.s1, P.s2, 0.4), mist: mix(P.s1, P.o0, 0.3),
    water: mix(P.s0, P.blue, 0.1), fogD: 0.00072, stars: 1, win: 1, snow: 0.16 },
  { e: -0.3, top: mix(P.crust, P.base, 0.6), mid: mix(P.base, P.s0, 0.5), hor: mix(P.s0, P.s1, 0.35), glow: P.s1, disc: P.lav,
    light: P.lav, lightI: 0, hemi: mix(P.lav, P.blue, 0.3), hemiI: 0.6, cloud: mix(P.s1, P.s2, 0.4), mist: mix(P.s1, P.o0, 0.3),
    water: mix(P.s0, P.blue, 0.1), fogD: 0.00072, stars: 1, win: 1, snow: 0.16 },
  { e: -0.08, top: mix(P.base, P.s1, 0.5), mid: mix(P.s1, P.mauve, 0.3), hor: mix(P.mauve, P.maroon, 0.35).lerp(P.s1, 0.45),
    glow: mix(P.maroon, P.peach, 0.4), disc: P.peach, light: P.maroon, lightI: 0, hemi: mix(P.lav, P.mauve, 0.4), hemiI: 0.85,
    cloud: mix(P.mauve, P.s2, 0.45), mist: mix(P.o0, P.mauve, 0.25), water: mix(P.s1, P.mauve, 0.2), fogD: 0.0008,
    stars: 0.45, win: 0.95, snow: 0.32 },
  { e: 0.06, top: mix(P.s1, P.o0, 0.3), mid: mix(P.pink, P.mauve, 0.35).lerp(P.o1, 0.2), hor: mix(P.pink, P.peach, 0.3).lerp(P.o2, 0.25),
    glow: P.rose, disc: mix(P.peach, P.yellow, 0.4), light: mix(P.peach, P.rose, 0.3), lightI: 2.6, hemi: mix(P.lav, P.pink, 0.4), hemiI: 1.5,
    cloud: mix(P.rose, P.pink, 0.3), mist: mix(P.text, P.lav, 0.3), water: mix(P.o1, P.blue, 0.35).lerp(P.lav, 0.2), fogD: 0.00078,

  { e: 0.3, top: mix(P.blue, P.lav, 0.5).lerp(P.o1, 0.35), mid: mix(P.lav, P.pink, 0.25).lerp(P.text, 0.2), hor: mix(P.rose, P.text, 0.5).lerp(P.lav, 0.15),
    glow: mix(P.rose, P.text, 0.5), disc: P.yellow, light: mix(P.rose, P.text, 0.4), lightI: 3.0, hemi: mix(P.lav, P.text, 0.4), hemiI: 1.7,
    cloud: P.text, mist: P.text, water: mix(P.o1, P.blue, 0.45), fogD: 0.00068, stars: 0, win: 0.06, snow: 0.18 },
  { e: 1.0, top: mix(P.blue, P.sapph, 0.25).lerp(P.lav, 0.25).lerp(P.o1, 0.15), mid: mix(P.lav, P.blue, 0.35).lerp(P.text, 0.35), hor: mix(P.text, P.lav, 0.35),
    glow: P.text, disc: P.yellow, light: mix(P.text, P.rose, 0.3), lightI: 3.1, hemi: mix(P.lav, P.text, 0.5), hemiI: 1.8,

const cur = {};
for (const k in KEYS[0]) cur[k] = KEYS[0][k].isColor ? KEYS[0][k].clone() : KEYS[0][k];
function sampleKeys(e) {
  let i = 0; while (i < KEYS.length - 2 && e > KEYS[i + 1].e) i++;
  const a = KEYS[i], b = KEYS[i + 1];

  const e = 0.82 * Math.sin(2 * Math.PI * (p - 0.25));
  const az = 2 * Math.PI * p + 2.3, c = Math.sqrt(1 - e * e);
  sunDir.set(Math.cos(az) * c, e, Math.sin(az) * c);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: !BLOOM, powerPreference: 'high-performance' });
renderer.setPixelRatio(HD ? devicePixelRatio : Math.min(devicePixelRatio, 1));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 9000);
scene.fog = new THREE.FogExp2(cur.hor.clone(), 0.00078);

// sky dome
const skyU = {
  sunDir: { value: sunDir }, cHor: { value: cur.hor }, cMid: { value: cur.mid }, cTop: { value: cur.top },
  cSun: { value: cur.disc }, cGlow: { value: cur.glow },

const sky = new THREE.Mesh(new THREE.SphereGeometry(6000, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position.z = gl_Position.w; }`,
  fragmentShader: `uniform vec3 sunDir,cHor,cMid,cTop,cSun,cGlow; varying vec3 vDir;
    void main(){

      vec3 col = mix(cHor, cMid, smoothstep(0.0, 0.3, y));
      col = mix(col, cTop, smoothstep(0.25, 0.95, y));
      col = mix(col, cHor, smoothstep(0.02, -0.05, y));
      float s = max(dot(d, sunDir), 0.0);
      float up = smoothstep(-0.25, 0.05, sunDir.y);

    }`,

scene.add(sky);

// stars (slowly wheeling)
const stars = (() => {
  const n = 1400, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), tints = [P.text, P.lav, P.rose, P.blue];
  for (let i = 0; i < n; i++) {
    const y = 0.12 + Math.pow(rnd(), 0.7) * 0.88, a = rnd() * Math.PI * 2, rr = Math.sqrt(1 - y * y);
    pos.set([Math.cos(a) * rr * 5500, y * 5500, Math.sin(a) * rr * 5500], i * 3);
    const c = tints[(rnd() * 4) | 0].clone().multiplyScalar(0.4 + rnd() * rnd() * 2.2);
    col.set([c.r, c.g, c.b], i * 3);
  }

  const pts = new THREE.Points(g, new THREE.PointsMaterial({ vertexColors: true, size: 1.8, sizeAttenuation: false, transparent: true, opacity: 1, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }));

// crescent moon
const moon = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const halo = g.createRadialGradient(64, 64, 10, 64, 64, 64);
  halo.addColorStop(0, 'rgba(245,224,220,.35)'); halo.addColorStop(1, 'rgba(245,224,220,0)');
  g.fillStyle = halo; g.fillRect(0, 0, 128, 128);
  const mc = document.createElement('canvas'); mc.width = mc.height = 128;
  const m = mc.getContext('2d');
  m.fillStyle = '#f5e0dc'; m.beginPath(); m.arc(64, 64, 18, 0, 7); m.fill();
  m.globalCompositeOperation = 'destination-out'; m.beginPath(); m.arc(73, 58, 16, 0, 7); m.fill();

  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, color: new THREE.Color(1.6, 1.6, 1.6), transparent: true, fog: false, depthWrite: false }));

const hemi = new THREE.HemisphereLight(cur.hemi.clone(), P.mantle, 1.5);
const sun = new THREE.DirectionalLight(cur.light.clone(), 2.6);

const winMat = new THREE.MeshBasicMaterial({ color: P.yellow.clone() });

// ---------- terrain ----------
const glowScale = { value: 0.3 };
{
  const SIZE = 3800, SEG = 360;
  const g = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;

  const forest = mix(P.base, P.s0, 0.5), forestHi = mix(P.s0, P.s1, 0.4), rock = mix(P.s1, P.o0, 0.4);
  const snow = mix(P.rose, P.pink, 0.35).lerp(P.text, 0.15), shore = mix(P.s2, P.flam, 0.12), bed = mix(P.s0, P.o0, 0.3);
  const meadow = mix(P.s0, C(0x3b4a48), 0.5);
  const glow = new Float32Array(p.count);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), up = nrm.getY(i), n = fbm(x * 0.02, z * 0.02, 2);
    if (y < -1) c.copy(bed);
    else if (y < 4) c.copy(shore);

const water = new Reflector(new THREE.CircleGeometry(2000, 64), {
  textureWidth: Math.round(innerWidth * 0.5), textureHeight: Math.round(innerHeight * 0.5), clipBias: 0.003,
  color: cur.water,

// ---------- placement helpers ----------
const keepClear = [];          // circles where no trees grow (village, campsite, cabins...)
const smokeSources = [];
const lampLights = [];         // point lights that come on at night: { L, I }
const animators = [];
const SIGHTS = [];             // landmarks the camera turns toward as it flies by          // per-frame callbacks (t, night, dt) for fires, beacons...
const SOLID = [], GLOW = [], DIM = [];   // static geometry, merged into three meshes at the end
// Best spot in a ring sector: within `spread` radians of angle `a` (or anywhere), height in range,
// as flat as possible over `flatR`, optionally next to water; `high` favours higher ground.
function findSpot({ a = null, spread = 0.3, rMin, rMax, hMin, hMax, flatR, wet = true, high = 0, tries = 4000 }) {
  let best = null, bestScore = 1e9;
  for (let i = 0; i < tries; i++) {
    const ang = a === null ? rnd() * Math.PI * 2 : a + (rnd() * 2 - 1) * spread;
    const r = rMin + rnd() * (rMax - rMin), x = Math.cos(ang) * r, z = Math.sin(ang) * r;
    const h = height(x, z); if (h < hMin || h > hMax) continue;

      const ka = k * Math.PI / 4;
      rough += Math.abs(height(x + Math.cos(ka) * flatR, z + Math.sin(ka) * flatR) - h);
      if (height(x + Math.cos(ka) * flatR * 2.2, z + Math.sin(ka) * flatR * 2.2) < 0) isWet = true;
    }
    const score = rough - high * h;
    if ((!wet || isWet) && score < bestScore) { bestScore = score; best = { x, z, h, a: ang }; }

      let sx = spot.x, sz = spot.z;                                   // walk to the shoreline
      for (let k = 0; k < 60 && height(sx, sz) > 0.5; k++) { sx += Math.cos(best); sz += Math.sin(best); }
      const ry = Math.atan2(Math.cos(best), Math.sin(best)), L = 32, plank = mix(P.base, P.peach, 0.14);
      SOLID.push(place(tinted(new THREE.BoxGeometry(3.4, 0.5, L).translate(0, 1.5, L / 2 - 3), plank), sx, 0, sz, ry));
      for (let k = 0; k <= 4; k++) for (const px of [-1.8, 1.8]) SOLID.push(place(tinted(new THREE.CylinderGeometry(0.25, 0.25, 9).translate(px, -3, k * (L - 4) / 4 - 2), P.base), sx, 0, sz, ry));
      SOLID.push(place(tinted(new THREE.CylinderGeometry(0.2, 0.2, 4).translate(1.8, 3.5, L - 3.5), P.mantle), sx, 0, sz, ry));
      GLOW.push(place(plain(new THREE.SphereGeometry(0.5, 6, 4).translate(1.8, 5.8, L - 3.5)), sx, 0, sz, ry));
      const lp = toWorld(1.8, 6.5, L - 3.5, sx, 0, sz, ry); addLight(P.peach, 250, 45, lp.x, lp.y, lp.z);
      const row = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 0.7, 8, 6, 1).rotateZ(Math.PI / 2).scale(1, 0.5, 1), new THREE.MeshLambertMaterial({ color: mix(P.maroon, P.s1, 0.55), flatShading: true }));
      row.position.copy(toWorld(-3.8, 0.5, L * 0.6, sx, 0, sz, ry)); row.rotation.y = ry + Math.PI / 2; scene.add(row);
      animators.push((t) => { row.position.y = 0.5 + Math.sin(t * 1.1 + 1) * 0.2; row.rotation.x = Math.sin(t * 0.8) * 0.04; });
    }
    for (let i = 0; i < 400; i++) {
      const a = rnd() * 6.28, d = 70 + rnd() * 120, x = spot.x + Math.cos(a) * d, z = spot.z + Math.sin(a) * d;
      if (height(x, z) < -8) {
        boat = new THREE.Group();
        const dark = new THREE.MeshLambertMaterial({ color: P.mantle, flatShading: true });
        const hull = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 0.8, 12, 6, 1), dark);
        hull.rotation.z = Math.PI / 2; hull.scale.set(1, 1, 0.55); boat.add(hull);
        const fisher = new THREE.Mesh(new THREE.ConeGeometry(0.9, 3.4, 5), dark); fisher.position.y = 2; boat.add(fisher);
        const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 9), dark); rod.position.set(3, 4.5, 0); rod.rotation.z = -0.9; boat.add(rod);
        const lantern = new THREE.Mesh(new THREE.SphereGeometry(0.45, 6, 4), winMat); lantern.position.set(-4.5, 1.6, 0); boat.add(lantern);
        const bl = new THREE.PointLight(P.peach, 0, 40, 1.6); bl.position.set(-4.5, 2.5, 0); boat.add(bl); lampLights.push({ L: bl, I: 300 });
        boat.position.set(x, 0.6, z); boat.rotation.y = rnd() * 6.28; scene.add(boat);
        break;
      }
    }
  }
}

// merge all the static buildings into three meshes
scene.add(new THREE.Mesh(mergeGeometries(SOLID), new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true })));
scene.add(new THREE.Mesh(mergeGeometries(GLOW), winMat));
if (DIM.length) scene.add(new THREE.Mesh(mergeGeometries(DIM), winMatDim));

// ---------- forest (instanced tiered pines) ----------
{
  const tier = (r, h, y) => new THREE.ConeGeometry(r, h, 7, 1).translate(0, y + h / 2, 0);
  const geo = mergeGeometries([
    new THREE.CylinderGeometry(0.04, 0.05, 0.15, 5).translate(0, 0.075, 0),
    tier(0.36, 0.5, 0.1), tier(0.27, 0.42, 0.36), tier(0.17, 0.36, 0.64),
  ].map((g) => g.toNonIndexed()));
  const MAX = 13000, mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ flatShading: true }), MAX);
  const tones = [P.base, P.mantle, mix(P.base, P.s0, 0.5), mix(P.base, C(0x2c3a3c), 0.6), P.s0, mix(P.base, C(0x30403a), 0.7)];
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3(), e = new THREE.Euler();
  let n = 0;
  for (let tries = 0; tries < 100000 && n < MAX; tries++) {
    const a = rnd() * Math.PI * 2, r = 200 + Math.sqrt(rnd()) * 1400;
    const x = Math.cos(a) * r, z = Math.sin(a) * r, h = height(x, z);
    if (h < 3 || h > 230 + 40 * fbm(x * 0.01, z * 0.01, 2)) continue;
    if (slopeAt(x, z, 3) > 0.9) continue;
    if (fbm(x * 0.006 + 99, z * 0.006, 3) < -0.25) continue;       // meadows
    if (keepClear.some((c) => Math.hypot(c.x - x, c.z - z) < c.r * (0.75 + 0.5 * rnd()))) continue;
    const ht = 12 + rnd() * 16 * (1 - h / 400);
    s.set(ht * (0.85 + rnd() * 0.3), ht, ht * (0.85 + rnd() * 0.3));
    q.setFromEuler(e.set((rnd() - 0.5) * 0.06, rnd() * 6.28, (rnd() - 0.5) * 0.06));
    m.compose(v.set(x, h - 1.5, z), q, s);
    mesh.setMatrixAt(n, m);
    mesh.setColorAt(n, tones[(rnd() * tones.length) | 0]);
    n++;
  }
  mesh.count = n;
  scene.add(mesh);
}

// ---------- mist, clouds, smoke ----------
const mists = [], clouds = [];
function drifter(list, opacity, sx, sy, x, y, z, drift, shade) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: soft, transparent: true, opacity, depthWrite: false }));
  sp.scale.set(sx, sy, 1); sp.position.set(x, y, z);
  sp.userData = { a: Math.atan2(z, x), r: Math.hypot(x, z), y, drift, phase: rnd() * 6.28, shade };
  scene.add(sp); list.push(sp);
}
for (let i = 0, k = 0; i < 4000 && k < 120; i++) {
  const a = rnd() * Math.PI * 2, r = 430 + rnd() * 540, x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (height(x, z) > 2) continue;
  drifter(mists, 0.15 + rnd() * 0.1, 220 + rnd() * 200, 50 + rnd() * 30, x, 10 + rnd() * 14, z, 0.004 + rnd() * 0.004, 0.9 + rnd() * 0.15);
  k++;
}
for (let i = 0; i < 26; i++) {
  const a = rnd() * Math.PI * 2, r = 150 + rnd() * 320;
  drifter(clouds, 0.16 + rnd() * 0.16, 260 + rnd() * 280, 70 + rnd() * 50, Math.cos(a) * r, 290 + rnd() * 160, Math.sin(a) * r, 0.006 + rnd() * 0.006, 0.85 + rnd() * 0.25);
}
const smoke = [];
for (const src of smokeSources) for (let i = 0; i < 10; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: soft, transparent: true, opacity: 0, depthWrite: false }));
  sp.userData = { k: i / 10, src, wob: rnd() * 6.28 }; scene.add(sp); smoke.push(sp);
}

// ---------- fireflies: little swarms in the forest at night, away from buildings ----------
const flies = (() => {
  const swarms = [];
  for (let i = 0; i < 3000 && swarms.length < 12; i++) {
    const a = rnd() * 6.28, r = 430 + rnd() * 260, x = Math.cos(a) * r, z = Math.sin(a) * r, h = height(x, z);
    if (h < 6 || h > 160 || slopeAt(x, z) > 0.7) continue;
    if (keepClear.some((c) => Math.hypot(c.x - x, c.z - z) < c.r + 45)) continue;
    if (swarms.some((s) => Math.hypot(s.x - x, s.z - z) < 150)) continue;
    swarms.push({ x, z });
  }
  const n = 12 * Math.max(1, swarms.length), base = [], pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const c = swarms[i % swarms.length] || { x: 600, z: 0 }, a = rnd() * 6.28, d = 4 + rnd() * 30;
    const x = c.x + Math.cos(a) * d, z = c.z + Math.sin(a) * d;
    base.push({ x, y: Math.max(height(x, z), 1) + 1.5 + rnd() * 5, z, p: rnd() * 100, s: 0.3 + rnd() * 0.5 });
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ map: soft, color: mix(P.yellow, P.green, 0.35).multiplyScalar(3), size: 1.8, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  pts.frustumCulled = false; pts.userData.base = base; scene.add(pts); return pts;
})();

// ---------- birds: a small flock circling the peak by day ----------
const birds = (() => {
  const n = 16, g = new THREE.BufferGeometry(), pos = new Float32Array(n * 4 * 3), info = [];
  for (let i = 0; i < n; i++) info.push({ off: new THREE.Vector3((rnd() - 0.5) * 50, (rnd() - 0.5) * 16, (rnd() - 0.5) * 50), ph: rnd() * 6.28, sp: 5 + rnd() * 2 });
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const ls = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: P.mantle, transparent: true, opacity: 0 }));
  ls.frustumCulled = false; ls.userData.info = info; scene.add(ls); return ls;
})();

// ---------- shooting stars ----------
const meteor = (() => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array([3, 3, 3.2, 0, 0, 0]), 3));
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }));
  l.frustumCulled = false; l.userData = { age: 99, life: 1, start: new THREE.Vector3(), vel: new THREE.Vector3() }; scene.add(l); return l;
})();

// ---------- post-processing ----------
let composer = null, bloom = null;
if (BLOOM) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.65, 0.92);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  composer.addPass(new ShaderPass({         // vignette + dither (after sRGB conversion, so gradients don't band)
    uniforms: { tDiffuse: { value: null }, time: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
      void main(){
        vec4 c = texture2D(tDiffuse, vUv);
        vec2 d = vUv - 0.5; d.x *= 1.25;
        c.rgb *= mix(0.78, 1.0, smoothstep(0.75, 0.2, length(d)));
        float n = fract(sin(dot(vUv * 1000.0 + time, vec2(12.9898, 78.233))) * 43758.5453);
        c.rgb += (n - 0.5) / 255.0;
        gl_FragColor = c;
      }`,
  }));
}

// ---------- flight path ----------
const R = 690, OMEGA = 0.0055 * SPEED;        // one lap in about 19 minutes
function pathXZ(t) { const a = t * OMEGA, r = R + 60 * Math.sin(t * 0.008 * SPEED + 1); return [Math.cos(a) * r, Math.sin(a) * r]; }
function targetY(t) {
  let g = 0;
  for (let k = 0; k <= 8; k++) { const [x, z] = pathXZ(t + k * 5 / SPEED); g = Math.max(g, height(x, z)); }
  return g + 75 + 60 * (0.5 + 0.5 * Math.sin(t * 0.017 * SPEED));
}
let camY = null, last = performance.now(), acc = 0, prevT = null;
const focus = new THREE.Vector3(), look = new THREE.Vector3(), ahead = new THREE.Vector3(), peak = new THREE.Vector3(0, 340, 0), tmp = new THREE.Vector3();

function frame(now) {
  requestAnimationFrame(frame);
  acc += now - last; last = now;
  if (acc < 1000 / FPS - 2) return;
  acc = 0;
  const t = T0 + now / 1000, dt = prevT === null ? 0 : Math.min(t - prevT, 0.1); prevT = t;

  // time of day
  const e = setTimeOfDay((TOD0 + t / (DAY * 60)) % 1);
  scene.fog.color.copy(cur.hor); scene.fog.density = cur.fogD;
  sun.position.copy(sunDir).multiplyScalar(1000); sun.color.copy(cur.light); sun.intensity = cur.lightI * smooth(-0.02, 0.08, e);
  moonLight.position.copy(moonDir).multiplyScalar(1000); moonLight.intensity = 0.9 * smooth(0.02, -0.2, e);
  hemi.color.copy(cur.hemi); hemi.intensity = cur.hemiI;
  glowScale.value = cur.snow;
  stars.material.opacity = cur.stars; stars.rotation.y = t * 0.0015;
  moon.position.copy(moonDir).multiplyScalar(5000); moon.material.opacity = 0.25 + 0.75 * smooth(0.25, -0.1, e);
  const night = cur.win;
  winMat.color.copy(P.yellow).multiplyScalar(0.3 + 1.9 * night);
  winMatDim.color.copy(P.peach).multiplyScalar(0.2 + 1.0 * night);
  for (const { L, I } of lampLights) L.intensity = I * night;
  if (bloom) bloom.strength = 0.35 + 0.3 * night;

  // camera
  const [x, z] = pathXZ(t);
  const ty = targetY(t);
  camY = camY === null ? ty : camY + (ty - camY) * Math.min(1, dt * 0.5);
  camera.position.set(x, camY, z);
  const [ax, az] = pathXZ(t + 40 / SPEED);
  ahead.set(ax, camY - 45, az);
  look.copy(ahead).lerp(peak, 0.3);
  // glance at landmarks: strongest when one is ~0.3 rad ahead along the orbit, fading smoothly either side
  const ca = Math.atan2(z, x); let wsum = 0; focus.set(0, 0, 0);
  for (const sg of SIGHTS) {
    let d = Math.atan2(sg.z, sg.x) - ca; d = Math.atan2(Math.sin(d), Math.cos(d));
    const w = Math.exp(-Math.pow((d - 0.3) / 0.22, 2));
    if (w > 0.001) { focus.addScaledVector(sg, w); wsum += w; }
  }
  if (wsum > 0.001) look.lerp(focus.divideScalar(wsum), 0.55 * Math.min(1, wsum));
  camera.up.set(0, 1, 0);
  camera.lookAt(look);
  camera.rotateZ(0.06 + 0.025 * Math.sin(t * 0.02));   // gentle bank into the turn

  // drifting mist and clouds
  for (const sp of mists) {
    const u = sp.userData; u.a += u.drift * dt * 0.3;
    sp.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(t * 0.2 + u.phase) * 3, Math.sin(u.a) * u.r);
    sp.material.color.copy(cur.mist).multiplyScalar(u.shade);
  }
  for (const sp of clouds) {
    const u = sp.userData; u.a += u.drift * dt * 0.3;
    sp.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(t * 0.1 + u.phase) * 6, Math.sin(u.a) * u.r);
    sp.material.color.copy(cur.cloud).multiplyScalar(u.shade);
  }
  for (const sp of smoke) {
    const u = sp.userData, k = (u.k + t * 0.045) % 1;
    sp.position.set(u.src.x + k * 20 + Math.sin(t * 0.8 + k * 8 + u.wob) * 2, u.src.y + k * 42, u.src.z + k * 9);
    const sc = 3.5 + k * 15; sp.scale.set(sc, sc, 1);
    sp.material.opacity = 0.32 * Math.sin(Math.PI * k);
    sp.material.color.copy(cur.mist).lerp(P.o0, 0.35);
  }
  if (boat) { boat.position.y = 0.6 + Math.sin(t * 1.3) * 0.25; boat.rotation.z = Math.sin(t * 0.9) * 0.04; }

  // fireflies
  const fo = Math.max(0, (night - 0.6) / 0.4);
  flies.material.opacity = 0.9 * fo;
  if (fo > 0) {
    const pa = flies.geometry.attributes.position, b = flies.userData.base;
    for (let i = 0; i < b.length; i++) {
      const f = b[i], tt = t * f.s + f.p;
      pa.setXYZ(i, f.x + Math.sin(tt) * 6 + Math.sin(tt * 2.3) * 2, f.y + Math.sin(tt * 1.7) * 1.5, f.z + Math.cos(tt * 0.9) * 6);
    }
    pa.needsUpdate = true;
  }

  // birds
  const bo = (1 - night) * smooth(-0.05, 0.1, e);
  birds.material.opacity = 0.85 * bo;
  if (bo > 0) {
    const pa = birds.geometry.attributes.position, info = birds.userData.info;
    const fa = -t * 0.035, fr = 520 + 40 * Math.sin(t * 0.05), fy = 230 + 30 * Math.sin(t * 0.07);
    const cx = Math.cos(fa) * fr, cz = Math.sin(fa) * fr;
    const fwd = tmp.set(Math.sin(fa), 0, -Math.cos(fa));            // direction of travel
    for (let i = 0; i < info.length; i++) {
      const b = info[i], flap = Math.sin(t * b.sp + b.ph) * 1.4;
      const bx = cx + b.off.x, by = fy + b.off.y, bz = cz + b.off.z;
      const rx = -fwd.z * 2.6, rz = fwd.x * 2.6;                      // wing span vector
      const o = i * 12;
      pa.array.set([bx - rx, by + flap, bz - rz, bx + fwd.x * 0.6, by, bz + fwd.z * 0.6,
                    bx + fwd.x * 0.6, by, bz + fwd.z * 0.6, bx + rx, by + flap, bz + rz], o);
    }
    pa.needsUpdate = true;
  }

  // shooting stars
  const mu = meteor.userData;
  mu.age += dt;
  if (mu.age > mu.life && cur.stars > 0.6 && Math.random() < dt / 18) {
    const a = Math.random() * 6.28, y = 0.35 + Math.random() * 0.4, c = Math.sqrt(1 - y * y);
    mu.start.set(Math.cos(a) * c, y, Math.sin(a) * c).multiplyScalar(5200);
    mu.vel.set(Math.random() - 0.5, -0.4 - Math.random() * 0.4, Math.random() - 0.5).cross(mu.start).normalize().multiplyScalar(2600);
    if (mu.vel.y > 0) mu.vel.negate();
    mu.age = 0; mu.life = 0.7 + Math.random() * 0.6;
  }
  if (mu.age < mu.life) {
    const pa = meteor.geometry.attributes.position;
    const hx = mu.start.x + mu.vel.x * mu.age, hy = mu.start.y + mu.vel.y * mu.age, hz = mu.start.z + mu.vel.z * mu.age;
    pa.array.set([hx, hy, hz, hx - mu.vel.x * 0.22, hy - mu.vel.y * 0.22, hz - mu.vel.z * 0.22]);
    pa.needsUpdate = true;
    meteor.material.opacity = Math.sin(Math.PI * mu.age / mu.life) * cur.stars;
  } else meteor.material.opacity = 0;

  for (const f of animators) f(t, night, dt);
  water.material.uniforms.time.value = t;
  if (composer) { composer.passes[composer.passes.length - 1].uniforms.time.value = t % 100; composer.render(); }
  else renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});
</script>
</body></html>
