<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mocha Forest</title>
<style>
  html, body { margin: 0; height: 100%; background: #11111b; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="points.js"></script>
<script>
(() => {
  const IW = 2560, IH = 1440;
  const C = { rosewater:'#f5e0dc', pink:'#f5c2e7', peach:'#fab387', yellow:'#f9e2af',
              sky:'#89dceb', sapphire:'#74c7ec', blue:'#89b4fa', lavender:'#b4befe',
              text:'#cdd6f4', overlay2:'#9399b2' };

  // ---- user settings (overridable from Wallpaper Engine) ----
  const cfg = { clouds: true, cloudSpeed: 1, stars: true, waterfall: true, river: true,
                fireflies: true, fireflyCount: 26, fps: 30 };

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const bg = new Image(); bg.src = 'background.jpg';
  const fg = new Image(); fg.src = 'foreground.png';
  const P = window.POINTS || { stars: [], river: [] };

  let dpr = 1, sc = 1, ox = 0, oy = 0;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(innerWidth * dpr);
    cv.height = Math.round(innerHeight * dpr);
    // debug: #view=x,y,w,h zooms onto an image region
    const m = /view=([\d.]+),([\d.]+),([\d.]+),([\d.]+)/.exec(location.hash);
    const [vx, vy, vw, vh] = m ? m.slice(1).map(Number) : [0, 0, IW, IH];
    sc = Math.max(cv.width / vw, cv.height / vh);
    ox = (cv.width - vw * sc) / 2 - vx * sc;
    oy = (cv.height - vh * sc) / 2 - vy * sc;
  }
  addEventListener('resize', resize); resize();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];

  // soft glow sprite
  function glowSprite(color, size = 64) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), r = size / 2;
    const gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, color); gr.addColorStop(0.25, color + 'aa');
    gr.addColorStop(1, color + '00');
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
    return c;
  }
  const glow = {
    star: glowSprite(C.lavender), white: glowSprite('#ffffff'),
    yellow: glowSprite(C.yellow), peach: glowSprite(C.peach), rose: glowSprite(C.rosewater)
  };

  // ---------------- clouds ----------------
  // flat, tapered streaks in the illustration's style
  function makeCloud(x) {
    const y = rnd(150, 540);
    const t = (y - 150) / 390;                  // 0 top .. 1 near horizon
    const cols = t < 0.35 ? [C.overlay2, C.blue] : t < 0.7 ? [C.blue, C.sapphire, C.lavender] : [C.lavender, C.sky, C.rosewater];
    const parts = [];
    const n = 1 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) parts.push({
      dx: rnd(-80, 120), dy: i * rnd(9, 16), len: rnd(140, 460) * (1 - i * 0.2), h: rnd(3, 11)
    });
    return { x: x ?? rnd(-500, IW), y, parts, color: pick(cols),
             a: rnd(0.18, 0.42) * (0.6 + t * 0.6), v: rnd(5, 16) * (0.6 + t * 0.6) };
  }
  const clouds = Array.from({ length: 16 }, () => makeCloud());

  function drawCloud(cl) {
    ctx.fillStyle = cl.color; ctx.globalAlpha = cl.a;
    for (const p of cl.parts) {
      const x = cl.x + p.dx, y = cl.y + p.dy, L = p.len, h = p.h;
      ctx.beginPath();
      ctx.moveTo(x, y + h);                      // left tip (pointed)
      ctx.lineTo(x + L * 0.28, y);
      ctx.lineTo(x + L, y + h * 0.35);           // right tip
      ctx.lineTo(x + L * 0.82, y + h);
      ctx.closePath(); ctx.fill();
    }
  }

  // ---------------- stars ----------------
  const stars = P.stars.map(([x, y, s]) => ({ x, y, s: Math.max(2, s), ph: rnd(0, 6.28), sp: rnd(0.6, 2.2) }));

  // ---------------- waterfall ----------------
  const falls = [ { x: 1185, y: 1016, w: 10, h: 45 }, { x: 1200, y: 1011, w: 27, h: 50 } ];
  const streaks = [];
  for (const f of falls) for (let i = 0; i < f.w * 3; i++)
    streaks.push({ f, x: f.x + rnd(0, f.w), y: rnd(0, f.h), len: rnd(6, 18), v: rnd(35, 65),
                   c: pick([C.rosewater, '#ffffff', '#ffffff', C.yellow]), a: rnd(0.3, 0.75), w: rnd(0.8, 1.6) });
  const mist = Array.from({ length: 10 }, () => newMist(true));
  function newMist(init) {
    return { x: rnd(1180, 1232), y: 1060, vx: rnd(-5, 5), vy: rnd(-7, -2), r: rnd(6, 14),
             life: init ? rnd(0, 3) : 0, max: rnd(2, 4) };
  }

  // ---------------- river glints ----------------
  const glints = [];
  function newGlint() {
    const [x, y] = pick(P.river);
    const near = y < 1160;
    return { x, y, w: rnd(4, near ? 10 : 16), life: 0, max: rnd(0.8, 2.6),
             c: near ? pick([C.yellow, C.rosewater, '#ffffff']) : pick([C.text, C.sky, C.lavender, '#ffffff']) };
  }
  if (P.river.length) for (let i = 0; i < 80; i++) { const g = newGlint(); g.life = rnd(0, g.max); glints.push(g); }

  // ---------------- fireflies ----------------
  let flies = [];
  function makeFlies() {
    flies = Array.from({ length: cfg.fireflyCount }, () => ({
      x: rnd(300, 2300), y: rnd(900, 1400), ph: rnd(0, 6.28), sp: rnd(0.15, 0.4),
      ax: rnd(20, 70), ay: rnd(10, 35), bl: rnd(0.4, 1.2), bp: rnd(0, 6.28), s: rnd(10, 22),
      g: pick([glow.yellow, glow.yellow, glow.peach])
    }));
  }
  makeFlies();

  // ---------------- loop ----------------
  let last = performance.now(), acc = 0, T = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const step = 1000 / cfg.fps;
    acc += now - last; last = now;
    if (acc < step) return;
    const dt = Math.min(acc, 100) / 1000; acc %= step;
    T += dt;
    if (!bg.complete || !fg.complete) return;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#11111b'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(sc, 0, 0, sc, ox, oy);
    ctx.drawImage(bg, 0, 0, IW, IH);

    // stars (behind trees)
    if (cfg.stars) {
      ctx.globalCompositeOperation = 'lighter';
      for (const s of stars) {
        const tw = 0.5 + 0.5 * Math.sin(T * s.sp + s.ph);
        ctx.globalAlpha = 0.1 + tw * 0.55;
        const r = 3 + tw * 4 + s.s * 0.5;
        ctx.drawImage(glow.star, s.x - r, s.y - r, r * 2, r * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // clouds (behind trees)
    if (cfg.clouds) {
      for (const cl of clouds) {
        cl.x += cl.v * cfg.cloudSpeed * dt;
        const maxL = 600;
        if (cl.x > IW + 100) Object.assign(cl, makeCloud(-maxL));
        drawCloud(cl);
      }
      ctx.globalAlpha = 1;
    }

    // foreground trees over the sky effects
    ctx.drawImage(fg, 0, 0, IW, fg.height);

    // waterfall
    if (cfg.waterfall) {
      ctx.save();
      ctx.beginPath(); for (const f of falls) ctx.rect(f.x, f.y, f.w, f.h); ctx.clip();
      for (const s of streaks) {
        s.y += s.v * dt; if (s.y > s.f.h + s.len) { s.y = -s.len; s.x = s.f.x + rnd(0, s.f.w); }
        ctx.globalAlpha = s.a; ctx.fillStyle = s.c;
        ctx.fillRect(s.x, s.f.y + s.y, s.w, s.len);
      }
      ctx.restore();
      for (let i = 0; i < mist.length; i++) {
        const m = mist[i]; m.life += dt;
        if (m.life > m.max) { mist[i] = newMist(false); continue; }
        m.x += m.vx * dt; m.y += m.vy * dt;
        const k = m.life / m.max, r = m.r * (1 + k * 1.5);
        ctx.globalAlpha = Math.sin(k * Math.PI) * 0.22;
        ctx.drawImage(glow.rose, m.x - r, m.y - r, r * 2, r * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // river glints
    if (cfg.river && glints.length) {
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < glints.length; i++) {
        const g = glints[i]; g.life += dt;
        if (g.life > g.max) { glints[i] = newGlint(); continue; }
        g.y += 3 * dt;
        const k = Math.sin((g.life / g.max) * Math.PI);
        ctx.globalAlpha = k * 0.55; ctx.fillStyle = g.c;
        const w = g.w * (0.6 + 0.4 * k);
        ctx.fillRect(g.x - w / 2, g.y, w, 1.6);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // fireflies
    if (cfg.fireflies) {
      ctx.globalCompositeOperation = 'lighter';
      for (const f of flies) {
        const x = f.x + Math.sin(T * f.sp + f.ph) * f.ax + Math.sin(T * f.sp * 2.3) * 8;
        const y = f.y + Math.cos(T * f.sp * 1.3 + f.ph) * f.ay;
        const b = Math.max(0, Math.sin(T * f.bl + f.bp));
        ctx.globalAlpha = 0.1 + b * 0.75;
        ctx.drawImage(f.g, x - f.s, y - f.s, f.s * 2, f.s * 2);
        ctx.globalAlpha = b * 0.9;
        ctx.drawImage(glow.white, x - 2.5, y - 2.5, 5, 5);
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);

  // Wallpaper Engine user properties
  window.wallpaperPropertyListener = {
    applyUserProperties(p) {
      const b = (k, n) => { if (p[k]) cfg[n] = !!p[k].value; };
      b('clouds', 'clouds'); b('stars', 'stars'); b('waterfall', 'waterfall');
      b('river', 'river'); b('fireflies', 'fireflies');
      if (p.cloudspeed) cfg.cloudSpeed = Number(p.cloudspeed.value);
      if (p.fireflycount) { cfg.fireflyCount = Number(p.fireflycount.value) | 0; makeFlies(); }
    },
    applyGeneralProperties(p) { if (p.fps) cfg.fps = Math.max(10, p.fps); }
  };
})();
</script>
</body>
</html>
